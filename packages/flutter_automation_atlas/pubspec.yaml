name: flutter_automation_atlas
description: Atlas of the flows of a Flutter app, with a snapshot of every flow variant, a screenshot and a journal per stage, and the page that shows them.
version: 0.12.0
repository: https://github.com/valeriinov/flutter_automation
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ^3.47.5

resolution: workspace

dependencies:
  analyzer: ">=13.3.0 <15.0.0"
  collection: ^1.19.1
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_automation:
    git:
      url: https://github.com/valeriinov/flutter_automation.git
      ref: 0.12.0
      path: packages/flutter_automation
  flutter_automation_runner:
    git:
      url: https://github.com/valeriinov/flutter_automation.git
      ref: 0.12.0
      path: packages/flutter_automation_runner
  image: ^4.10.1
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

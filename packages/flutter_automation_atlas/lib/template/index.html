<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas</title>

<style>
  :root {
    color-scheme: light;
    --brand: #0F766E;
    --brand-strong: #0F766E;
    --brand-soft: #E3F4F1;
    --brand-l: #14867D;
    --brand-bg2: #F1FAF8;
    --brand-line: #BFE3DD;
    --ground: #F7F6F3;
    --surface: #FFFFFF;
    --surface-sunk: #FAF9F7;
    --line: #E7E4DE;
    --line-strong: #D9D5CD;
    --ink: #1C1A17;
    --ink-soft: #45413B;
    --muted: #6B665E;
    --ok: #2F8F4E;
    --warn: #B45309;
    --search-hit: #FF6B00;
    --danger: #C2283F;
    --code-ink: #45413B;
    --shadow: 0 1px 3px rgba(28, 26, 23, .06), 0 10px 28px -18px rgba(28, 26, 23, .25);
    --canvas-bg: #EDEBE6;
    --canvas-dot: #D9D5CD;
    --edge-idle: #A39E95;
    --on-kind: #FFFFFF;

    --kind-request: #0369A1;
    --kind-analytics: #C2410C;
    --kind-state: #0F766E;

    --font-display: system-ui, -apple-system, Roboto, 'Segoe UI', sans-serif;
    --font-body: system-ui, -apple-system, Roboto, 'Segoe UI', sans-serif;
    --font-mono: Menlo, ui-monospace, 'SF Mono', monospace;

    --measure: 68ch;
    --page: 1680px;
    --inspector: 280px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body.is-locked { overflow: hidden; }

  .wrap {
    max-width: var(--page);
    margin: 0 auto;
    padding: 0 24px;
  }

  button:focus-visible,
  summary:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
  }

  /* ---------- language ---------- */

  :root:not([data-lang="uk"]) [lang="uk"] { display: none; }
  :root[data-lang="uk"] [lang="en"] { display: none; }

  .lang-toggle {
    display: inline-flex;
    flex: none;
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    overflow: hidden;
    background: var(--surface);
  }

  .lang-toggle button {
    appearance: none;
    border: 0;
    background: none;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 6px 12px;
    cursor: pointer;
  }

  .lang-toggle button + button { border-left: 1px solid var(--line); }
  .lang-toggle button:hover { color: var(--ink); }
  .lang-toggle button[aria-pressed="true"] { background: var(--brand); color: #fff; }
  .lang-toggle button:focus-visible { outline-offset: -2px; }

  /* ---------- head ---------- */

  .page-head {
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    padding: 28px 0 20px;
  }

  .head-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin: 0 0 10px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
    overflow-wrap: anywhere;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(30px, 4.4vw, 44px);
    line-height: 1.1;
    letter-spacing: -.01em;
    margin: 0;
  }

  .stats {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 18px 0 0;
    padding: 0;
  }

  .stats li {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px 16px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--surface-sunk);
    min-width: 132px;
  }

  .stats b {
    font-family: var(--font-mono);
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }

  .stats span { font-size: 12px; color: var(--muted); }
  .stats small { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

  /* ---------- shared bits ---------- */

  code {
    font-family: var(--font-mono);
    font-size: .875em;
    background: var(--surface-sunk);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 5px;
    color: var(--code-ink);
    overflow-wrap: anywhere;
  }

  a { color: var(--brand); text-underline-offset: 2px; }

  .chip {
    display: inline-block;
    max-width: 100%;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.6;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0 7px;
    overflow-wrap: anywhere;
  }

  .chip-fail { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }

  .badge {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    line-height: 1.6;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 0 8px;
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    color: var(--muted);
    white-space: nowrap;
  }

  .badge-fail { color: var(--surface); background: var(--danger); border-color: var(--danger); }
  .badge-default { color: var(--brand); border-color: var(--brand); }

  .fail-mark { flex: none; color: var(--danger); font-size: 11px; font-weight: 700; }
  .ok-mark { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

  .count-badge {
    display: inline-block;
    flex: none;
    min-width: 18px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--kind-request);
    color: var(--on-kind);
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 700;
    line-height: 18px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .kind-request-bg { background: var(--kind-request); }
  .kind-analytics-bg { background: var(--kind-analytics); }
  .kind-state-bg { background: var(--kind-state); }

  [data-kind="request"] { --kind: var(--kind-request); }
  [data-kind="analytics"] { --kind: var(--kind-analytics); }
  [data-kind="state"] { --kind: var(--kind-state); }

  .empty {
    padding: 28px 16px;
    color: var(--muted);
    font-size: 15px;
  }

  /* ---------- flow tabs ---------- */

  .app { padding-top: 18px; padding-bottom: 56px; }

  .flow-tabs {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    border-bottom: 1px solid var(--line);
    scrollbar-width: thin;
  }

  .flow-tab {
    appearance: none;
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
    max-width: 320px;
    border: 0;
    border-bottom: 2px solid transparent;
    background: none;
    color: var(--muted);
    font: inherit;
    text-align: left;
    padding: 8px 14px 9px;
    cursor: pointer;
  }

  .flow-tab:hover { color: var(--ink); }
  .flow-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); }
  .flow-tab:focus-visible { outline-offset: -2px; }
  .flow-tab-title { font-weight: 650; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
  .flow-tab-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; }
  .flow-tab-meta .fail { color: var(--danger); }

  /* ---------- toolbar ---------- */

  .toolbar { padding: 14px 0 12px; }

  .toolbar-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 20px;
  }

  .variant-pills,
  .kind-legends {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  .vpill {
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    max-width: 100%;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    text-align: left;
    padding: 4px 12px;
    border-radius: 999px;
    cursor: pointer;
    overflow-wrap: anywhere;
  }

  .vpill:hover { border-color: var(--brand); }
  .vpill.is-failed { border-color: color-mix(in srgb, var(--danger) 60%, transparent); }
  .vpill[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
  .vpill[aria-pressed="true"] .fail-mark { color: #fff; }
  .vpill[aria-pressed="true"] .ok-mark { background: #fff; }

  .kind-legends-caption { font-size: 12px; color: var(--muted); }

  .vselect { position: relative; flex: 0 1 auto; flex-wrap: nowrap; z-index: 15; }
  .vselect-btn { appearance: none; display: inline-flex; align-items: center; gap: 8px; max-width: min(560px, 100%); min-height: 36px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; padding: 4px 10px 4px 12px; cursor: pointer; text-align: left; }
  .vselect-btn:hover, .vselect-btn[aria-expanded="true"] { border-color: var(--brand); }
  .vselect-btn.is-failed { border-color: color-mix(in srgb, var(--danger) 60%, transparent); }
  .vselect-caption { flex: none; font-size: 12px; font-weight: 400; color: var(--muted); }
  .vselect-label { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .vselect-pos { flex: none; font-family: var(--font-mono); font-size: 11.5px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .vselect-caret { flex: none; color: var(--muted); font-size: 12px; }
  .vselect-list { position: absolute; left: 0; top: calc(100% + 4px); min-width: 100%; width: max-content; max-width: min(560px, calc(100vw - 32px)); max-height: min(60vh, 420px); overflow: auto; padding: 4px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); }
  .vselect-list[hidden] { display: none; }
  .vselect-list .vselect-item { display: flex; width: 100%; border: 0; border-radius: 6px; background: none; padding: 7px 10px; font-weight: 500; }
  .vselect-list .vselect-item .vselect-label { flex: 1 1 auto; }
  .vselect-list .vselect-item:hover, .vselect-list .vselect-item:focus-visible { background: var(--surface-sunk); outline: none; }
  .vselect-list .vselect-item[aria-selected="true"] { background: var(--brand-soft); color: var(--brand-strong); font-weight: 650; }

  .kind-legend {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 4px;
    background: color-mix(in srgb, var(--kind) 12%, transparent);
    color: var(--ink-soft);
    font-size: 13px;
    line-height: 1.5;
    padding: 2px 9px 2px 8px;
    cursor: default;
    user-select: none;
  }

  .kind-swatch { flex: none; width: 9px; height: 9px; border-radius: 2px; background: var(--kind); }
  .kind-legend-count { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }

  .variant-about {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 12px;
    margin: 10px 0 0;
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  .variant-about .proves { max-width: var(--measure); }

  /* ---------- workspace ---------- */

  .workspace {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--inspector);
    gap: 16px;
    align-items: start;
  }

  .canvas {
    position: relative;
    min-width: 0;
    max-height: calc(100vh - 24px);
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 8px;
    background-color: var(--canvas-bg);
    background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1.4px);
    background-size: 20px 20px;
    background-attachment: local;
  }

  .canvas.is-panning { cursor: grabbing; user-select: none; }

  .graph-box { position: relative; overflow: hidden; }
  .graph-box.is-pinching { overflow: visible; }
  .graph { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  .edges {
    position: absolute;
    left: 0;
    top: 0;
    z-index: 2;
    overflow: visible;
    pointer-events: none;
  }

  .edge { fill: none; stroke: var(--edge-idle); stroke-width: 1.5; }
  .edge.is-on-path { stroke: var(--brand); stroke-width: 2; }
  .edge.is-failed { stroke: var(--danger); }
  .edge.is-dashed { stroke-dasharray: 5 4; }
  .edge.is-focused { stroke-width: 3; }
  .marker-idle { fill: var(--edge-idle); }
  .marker-on { fill: var(--brand); }
  .marker-fail { fill: var(--danger); }

  /* ---------- frames ---------- */

  .frame { position: absolute; z-index: 1; }

  .frame-head {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  .frame-title {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }

  .frame-title.is-fallback { font-style: italic; }

  .frame-design {
    flex: none;
    display: inline-grid;
    place-items: center;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    color: var(--muted);
  }

  .frame-design:hover { color: var(--brand); background: var(--surface); }
  .frame-design svg { display: block; }

  .frame-shot {
    appearance: none;
    position: relative;
    display: block;
    width: 100%;
    padding: 0;
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface-sunk);
    box-shadow: var(--shadow);
    cursor: pointer;
  }

  .frame-shot img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .frame-shot .shot-empty {
    display: grid;
    place-items: center;
    height: 100%;
    padding: 8px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }

  .frame.is-dim .frame-head,
  .frame.is-dim .frame-shot { opacity: .45; transition: opacity .15s; }
  .frame.is-dim:hover .frame-head,
  .frame.is-dim:hover .frame-shot { opacity: .9; }
  .frame.is-on-path .frame-title { color: var(--ink-soft); }
  .frame.is-focused .frame-title { color: var(--brand); font-weight: 600; }
  .frame.is-focused .frame-shot { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand), var(--shadow); }
  .frame.is-failed .frame-shot { border-color: var(--danger); box-shadow: 0 0 0 2px var(--danger), var(--shadow); }
  .frame.is-failed .frame-title { color: var(--danger); }

  .shot-marks {
    position: absolute;
    left: -1px;
    top: -1px;
    overflow: visible;
    pointer-events: none;
  }

  .tap-mark { --mark: var(--edge-idle); opacity: .7; }
  .tap-mark.is-on-path { --mark: var(--brand); opacity: 1; }
  .tap-mark.is-failed { --mark: var(--danger); }
  .tap-ring { fill: color-mix(in srgb, var(--mark) 22%, transparent); stroke: color-mix(in srgb, var(--mark) 50%, transparent); stroke-width: 1; }
  .tap-mark.is-focused .tap-ring { fill: color-mix(in srgb, var(--mark) 34%, transparent); }
  .tap-dot { fill: var(--mark); stroke: #FFFFFF; stroke-width: 1.5; filter: drop-shadow(0 0 1px rgba(2, 6, 23, .75)); }
  .swipe-line { fill: none; stroke: var(--mark); stroke-width: 2.5; stroke-linecap: round; }

  .frame-shot > .count-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    box-shadow: 0 0 0 2px var(--surface);
  }

  .frame-ends {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
    padding-top: 8px;
    min-width: 0;
  }

  .end-note {
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    max-width: 100%;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font: inherit;
    font-size: 11.5px;
    line-height: 1.5;
    padding: 0 9px 0 7px;
    cursor: pointer;
  }

  .end-note:hover { color: var(--ink); border-color: var(--brand); }
  .end-note.is-on-path { color: var(--brand-strong); border-color: var(--brand); }
  .end-note-text { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .end-note::before { content: ''; flex: none; width: 7px; height: 7px; border-radius: 2px; background: currentColor; }

  /* ---------- arrow pills ---------- */

  .edge-pill {
    appearance: none;
    position: absolute;
    z-index: 3;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 22px;
    min-width: 0;
    transform: translate(-50%, -50%);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font: inherit;
    font-size: 11.5px;
    line-height: 1;
    padding: 0 3px 0 8px;
    white-space: nowrap;
    cursor: pointer;
  }

  .edge-pill.has-no-badge { padding-right: 8px; }
  .edge-pill:hover { border-color: var(--brand); color: var(--ink); }
  .edge-pill.is-on-path { border-color: var(--brand); color: var(--brand-strong); }
  .edge-pill.is-failed { border-color: var(--danger); color: var(--danger); }
  .edge-pill.is-focused { background: var(--brand); border-color: var(--brand); color: #fff; }
  .edge-pill.is-failed.is-focused { background: var(--danger); border-color: var(--danger); }
  .edge-pill.is-focused .count-badge { box-shadow: 0 0 0 1.5px var(--surface); }
  .edge-pill-glyph { flex: none; font-size: 12px; }
  .edge-pill-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- inspector ---------- */

  .inspector {
    position: sticky;
    top: calc(12px + var(--mode-bar));
    min-width: 0;
    max-height: calc(100vh - 24px - var(--mode-bar));
    overflow: auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }

  .inspector[hidden] { display: none; }

  .insp-head {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--line);
  }

  .insp-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 0 0 6px;
  }

  .insp-kicker {
    min-width: 0;
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  .insp-nav { display: inline-flex; flex: none; gap: 4px; }

  .insp-nav button {
    appearance: none;
    width: 28px;
    height: 26px;
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    background: var(--surface);
    color: var(--ink-soft);
    font: inherit;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }

  .insp-nav button:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
  .insp-nav button:disabled { opacity: .4; cursor: default; }

  .insp-title {
    margin: 0;
    font-size: 18px;
    font-weight: 650;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }

  .insp-title code { font-size: 15px; font-weight: 500; }

  .insp-sub {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  .insp-head .badge-fail { margin-top: 8px; }


  .insp-empty { margin: 4px 0; font-size: 14px; color: var(--muted); }

  .kv {
    display: grid;
    grid-template-columns: minmax(96px, auto) minmax(0, 1fr);
    gap: 6px 12px;
    font-size: 13px;
    margin: 0;
  }

  .kv dt { color: var(--muted); }
  .kv dd {
    margin: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 10px;
    min-width: 0;
  }

  .link-btn {
    appearance: none;
    border: 0;
    background: none;
    padding: 0;
    color: var(--brand);
    font: inherit;
    font-size: 13px;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }

  .design-link { font-size: 12.5px; white-space: nowrap; }

  .stage-error {
    margin: 0;
    padding: 8px 10px;
    border-left: 3px solid var(--danger);
    border-radius: 0 4px 4px 0;
    background: color-mix(in srgb, var(--danger) 10%, var(--surface));
    color: var(--danger);
    font-family: var(--font-mono);
    font-size: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .more { margin: 14px 0 0; }

  .more > summary {
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
  }

  .more > summary:hover { color: var(--ink); }

  /* ---------- records ---------- */

  .recs {
    list-style: none;
    display: grid;
    gap: 6px;
    margin: 0;
    padding: 0;
  }

  .m-steps { list-style: none; margin: 0; padding: 0; }

  .m-info { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; min-width: 0; padding-top: 2px; }
  .m-screen { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }

  .m-action { align-self: flex-start; display: inline-flex; align-items: center; gap: 2px; max-width: 100%; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--brand-line); background: var(--surface); color: var(--brand-strong); font-size: 12.5px; font-weight: 700; }

  .fork-count { padding: 0 6px; border-radius: 999px; background: rgba(21, 24, 35, .08); font-size: 11px; }

  body.is-viewing { overflow: hidden; }

  .viewer[hidden] { display: none; }
  .v-bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }

  .v-shot-btn { appearance: none; position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; border: 0; background: none; cursor: zoom-in; touch-action: pan-y; }
  .v-shot { position: relative; display: block; height: min(56vh, 520px); aspect-ratio: 1206 / 2622; border-radius: 22px; overflow: hidden; border: 5px solid #10131D; background: var(--surface); box-shadow: 0 18px 40px -18px rgba(21, 24, 35, .45); }
  .v-shot .m-tap { width: 22px; height: 22px; margin: -11px 0 0 -11px; border-width: 3px; box-shadow: 0 0 0 6px rgba(85, 119, 238, .35); }

<script>
var atlasVersions = { current: '', list: [], isFailed: false };

function readAtlasPageData() {
  'use strict';

  var empty = { flows: [], totals: {} };

  return readPackedData().then(function (parsed) {
    if (!parsed || !Array.isArray(parsed.flows)) { return empty; }
    var shots = JSON.parse(document.getElementById('atlas-shots').textContent);
    parsed.shotSheets = shots.shotSheets;
    parsed.shotCells = shots.shotCells;
    parsed.shotUrlTemplate = shots.shotUrlTemplate || '';
    return resolveBlobs(parsed, parsed.blobs || []);
  }).catch(function () { return empty; });

  function readPackedData() {
    return Promise.resolve().then(function () {
      var parsed = JSON.parse(document.getElementById('atlas-data').textContent);
      if (parsed === null) { return readVersionData(); }
      if (typeof parsed !== 'string') { return parsed; }
      return inflate(parsed).then(JSON.parse);
    });
  }

  function inflate(base64) {
    var binary = atob(base64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
    return inflateBytes(bytes);
  }

  function inflateBytes(bytes) {
    return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }

  /* A page with null data is the page of a version folder: its data, its meta and its link template come over HTTP. */
  function readVersionData() {
    var versionsRead = fetchJson('../versions.json').then(function (rows) {
      atlasVersions.list = Array.isArray(rows) ? rows : [];
    });
    atlasVersions.current = readVersionFolder();
    return fetchVersionFile().then(function (file) {
      if (!file || !file.data) { throw new Error('No data in the version file'); }
      return Promise.all([fetchJson('../atlas-config.json'), versionsRead]).then(function (answers) {
        var config = answers[0] && typeof answers[0] === 'object' ? answers[0] : {};
        var shotUrlTemplate = typeof config.shotUrlTemplate === 'string' && config.shotUrlTemplate ? config.shotUrlTemplate : file.shotUrlTemplate;
        document.getElementById('atlas-meta').textContent = JSON.stringify(file.meta || {});
        document.getElementById('atlas-shots').textContent = JSON.stringify({ shotSheets: [], shotCells: {}, shotUrlTemplate: shotUrlTemplate || '' });
        if (typeof file.version === 'string') { atlasVersions.current = file.version; }
        return file.data;
      });
    }).catch(function (error) {
      atlasVersions.isFailed = true;
      return versionsRead.then(function () { throw error; });
    });
  }

  /* The folder of a version page carries the label of the version. */
  function readVersionFolder() {
    var folders = window.location.pathname.split('/').filter(function (part) { return part && part !== 'index.html'; });
    try {
      return decodeURIComponent(folders[folders.length - 1] || '');
    } catch (error) {
      return '';
    }
  }

  function fetchVersionFile() {
    return fetch('./data.json.gz').then(function (response) {
      if (!response.ok) { throw new Error('No version data: ' + response.status); }
      return response.arrayBuffer();
    }).then(function (buffer) {
      var bytes = new Uint8Array(buffer);
      if (bytes.length < 2 || bytes[0] !== 0x1f || bytes[1] !== 0x8b) { throw new Error('The version data is not gzip'); }
      return inflateBytes(bytes);
    }).then(JSON.parse);
  }

  function fetchJson(url) {
    return fetch(url, { cache: 'no-cache' }).then(function (response) {
      return response.ok ? response.json() : null;
    }).catch(function () { return null; });
  }

  function resolveBlobs(value, blobs) {
    if (Array.isArray(value)) {
      for (var i = 0; i < value.length; i++) { value[i] = resolveBlobs(value[i], blobs); }
      return value;
    }
    if (!value || typeof value !== 'object') { return value; }
    var keys = Object.keys(value);
    if (keys.length === 1 && keys[0] === '$blob' && typeof value.$blob === 'number') { return blobs[value.$blob]; }
    keys.forEach(function (key) { value[key] = resolveBlobs(value[key], blobs); });
    return value;
  }
}
</script>

    if (versions.length < 2) { return; }
    versions.slice().reverse().forEach(function (entry) {
      var option = el('option', null, [entry.version, entry.sourceLabel].filter(Boolean).join(' · '));
      option.value = entry.version;
      option.selected = entry.version === atlasVersions.current;
      box.appendChild(option);
    });
    box.hidden = false;
    box.addEventListener('change', function () {
      window.location.href = '../' + encodeURIComponent(box.value) + '/';
    });
  }

  function switchLang(value) {
    applyLang(value);
    storeLang(lang);
    renderFacets();
    renderSearchCount();
    renderResults();
    if (flows.length) { renderAll(); }
  }

  langButtons.en.addEventListener('click', function () { switchLang('en'); });
  langButtons.uk.addEventListener('click', function () { switchLang('uk'); });

  /* ---------- static copy and totals ---------- */

  Array.prototype.forEach.call(document.querySelectorAll('[data-copy]'), function (node) {
    node.appendChild(copyNode('span', null, node.getAttribute('data-copy')));
  });

  function statItem(count, labelKey, extra) {
    var item = el('li');
    var num = el('b', null, String(count));
    if (extra) { num.appendChild(extra); }
    item.appendChild(num);
    item.appendChild(copyNode('span', null, labelKey, count));
    return item;
  }

  function renderStats() {
    var totals = data.totals || {};
    var stats = document.getElementById('stats');
    stats.appendChild(statItem(totals.flows || 0, 'statFlows'));
    stats.appendChild(statItem(totals.variants || 0, 'statVariants'));
    stats.appendChild(statItem(totals.stages || 0, 'statStages'));
    stats.appendChild(statItem(totals.shots || 0, 'statShots', totals.shotsBytes == null ? null : copyNode('small', null, 'shotsSize', totals.shotsBytes)));
  }

  /* ---------- graph model ---------- */

  function stageSignature(stage) {
    return stableJson([stage.screen, stage.action, stage.target]);
  }

  function trieNode(stage, depth) {
    return { stage: stage, depth: depth, children: [], childBySignature: new Map(), through: [], ends: [] };
  }

  function insertionOrder(flow) {
    var first = defaultVariantIndex(flow);
    var order = [first];
    variantsOf(flow).forEach(function (variant, variantIndex) {
      if (variantIndex !== first && !isStateWalk(flow, variant)) { order.push(variantIndex); }
    });
    return order;
  }

  function buildTrie(variants, order) {
    var top = trieNode(null, -1);
    order.forEach(function (variantIndex) {
      var node = top;
      node.through.push(variantIndex);
      stagesOf(variants[variantIndex]).forEach(function (stage, depth) {
        var signature = stageSignature(stage);
        var child = node.childBySignature.get(signature);
        if (!child) {
          child = trieNode(stage, depth);
          node.childBySignature.set(signature, child);
          node.children.push(child);
        }
        child.through.push(variantIndex);
        node = child;
      });
      node.ends.push(variantIndex);
    });
    return top;
  }

  function nextItems(node, variants, rank) {
    var items = node.children.map(function (child) {
      return { kind: 'stage', node: child, through: child.through, screen: child.stage.screen };
    });
    node.ends.forEach(function (variantIndex) {
      var variant = variants[variantIndex];
      if (hasEnd(variant)) {
        items.push({ kind: 'end', variant: variantIndex, through: [variantIndex], screen: endOf(variant).screen });
      }
    });
    items.sort(function (a, b) { return rank[a.through[0]] - rank[b.through[0]]; });
    return items;
  }

  function groupByScreen(items) {
    var groups = [];
    var byScreen = {};
    items.forEach(function (item) {
      var key = typeof item.screen === 'string' && item.screen ? item.screen : null;
      if (key !== null && Object.prototype.hasOwnProperty.call(byScreen, key)) {
        byScreen[key].push(item);
        return;
      }
      var group = [item];
      groups.push(group);
      if (key !== null) { byScreen[key] = group; }
    });
    return groups;
  }

  function buildGraph(flow) {
    var variants = variantsOf(flow);
    var order = insertionOrder(flow);
    var rank = {};
    order.forEach(function (variantIndex, position) { rank[variantIndex] = position; });

    var graph = {
      frames: [],
      edges: [],
      rows: 1,
      cols: 0,
      hasEndNotes: variants.length > 1,
      framesByVariant: variants.map(function () { return []; }),
      edgesByVariant: variants.map(function () { return []; })
    };

    function addEdge(sourceFrame, node, target, through) {
      var edge = { id: graph.edges.length, from: sourceFrame, depth: node.depth, to: target, through: through };
      graph.edges.push(edge);
      through.forEach(function (variantIndex) { graph.edgesByVariant[variantIndex][node.depth] = edge; });
    }

    function placeUnder(node, sourceFrame, inheritedRow) {
      var groups = groupByScreen(nextItems(node, variants, rank));
      var col = node.depth + 1;
      graph.cols = Math.max(graph.cols, groups.length ? col + 1 : 0);

      groups.forEach(function (group, index) {
        var through = [];
        group.forEach(function (item) { through = through.concat(item.through); });
        through.sort(function (a, b) { return rank[a] - rank[b]; });
        var row = index === 0 && inheritedRow !== null ? inheritedRow : graph.rows++;
        var frame = { id: graph.frames.length, col: col, row: row, members: group, through: through };
        graph.frames.push(frame);
        through.forEach(function (variantIndex) { graph.framesByVariant[variantIndex][col] = frame; });
        if (sourceFrame) { addEdge(sourceFrame, node, frame, through); }

        var rowIsTaken = false;
        group.forEach(function (item) {
          if (item.kind !== 'stage') { return; }
          placeUnder(item.node, frame, rowIsTaken ? null : frame.row);
          rowIsTaken = true;
        });
      });

      var unfinished = node.ends.filter(function (variantIndex) { return !hasEnd(variants[variantIndex]); });
      if (sourceFrame && unfinished.length) {
        addEdge(sourceFrame, node, null, unfinished);
      }
    }

    placeUnder(buildTrie(variants, order), null, 0);
    return graph;
  }

  var graphs = [];

  function graphOf(flowIndex) {
    if (!graphs[flowIndex]) { graphs[flowIndex] = buildGraph(flows[flowIndex]); }
    return graphs[flowIndex];
  }

  /* ---------- selection ---------- */

  var flowTabs = document.getElementById('flow-tabs');
  var toolbar = document.getElementById('toolbar');
  var canvas = document.getElementById('canvas');
  var inspector = document.getElementById('inspector');
  var state = { flow: -1, variant: -1, focus: null, kind: KINDS[0] || '', open: initialOpen(), stateWalk: -1 };

  function currentFlow() {
    return flows[state.flow];
  }

  function currentVariants() {
    return variantsOf(currentFlow());
  }

  function currentVariant() {
    return currentVariants()[state.variant];
  }

  function pickVariant(through) {
    return includes(through, state.variant) ? state.variant : through[0];
  }

  function walkSteps(variant) {
    var steps = [];
    stagesOf(variant).forEach(function (stage, index) {
      steps.push({ part: 'frame', index: index });
      steps.push({ part: 'arrow', index: index });
    });
    if (hasEnd(variant)) { steps.push({ part: 'frame', index: stagesOf(variant).length }); }
    return steps;
  }

  function stepPosition(steps, focus) {
    if (!focus) { return -1; }
    for (var position = 0; position < steps.length; position += 1) {
      if (steps[position].part === focus.part && steps[position].index === focus.index) { return position; }
    }
    return -1;
  }

  function fitFocus(focus, variant) {
    var steps = walkSteps(variant);
    if (!steps.length) { return null; }
    if (stepPosition(steps, focus) !== -1) { return focus; }
    if (!focus) { return steps[0]; }
    var position = Math.min(steps.length - 1, focus.index * 2 + (focus.part === 'arrow' ? 1 : 0));
    return steps[Math.max(0, position)];
  }

  function isEndIndex(variant, index) {
    return index === stagesOf(variant).length;
  }

  /* an artifact link keeps only a plain #token (letters, digits, . _ ~ -), so the hash is flow.variant.f3 / .a3 / .end */
  function hashFor() {
    var flow = currentFlow();
    var variant = currentVariant();
    var parts = [flow.name];
    if (variant) { parts.push(variant.name); }
    if (variant && state.focus) {
      parts.push(isEndIndex(variant, state.focus.index) ? 'end' : (state.focus.part === 'arrow' ? 'a' : 'f') + state.focus.index);
    }
    return '#' + parts.join('.');
  }

  function writeHash() {
    if (!flows.length) { return; }
    var hash = hashFor();
    if (window.location.hash === hash) { return; }
    try {
      window.history.replaceState(null, '', hash);
    } catch (e) {
      window.location.hash = hash;
    }
  }

  function readHash() {
    var raw = String(window.location.hash || '').replace(/^#/, '');
    var parts;
    try { parts = decodeURIComponent(raw).split('.'); } catch (e) { parts = []; }
    var flowIndex = flows.map(function (flow) { return flow.name; }).indexOf(parts[0]);
    if (flowIndex === -1) { flowIndex = firstFlowIndex(); }
    var variants = variantsOf(flows[flowIndex]);
    var variantIndex = variants.map(function (variant) { return variant.name; }).indexOf(parts[1]);
    if (variantIndex === -1) { variantIndex = defaultVariantIndex(flows[flowIndex]); }
    var stateTarget = stateWalkTarget(flows[flowIndex], variantIndex);
    if (stateTarget) {
      var mainVariant = variants[stateTarget.main];
      return { flow: flowIndex, variant: stateTarget.main, stateWalk: variantIndex, focus: fitFocus({ part: 'frame', index: stateTarget.at }, mainVariant) };
    }
    var variant = variants[variantIndex];
    var focus = null;
    if (parts[2] === 'end' && hasEnd(variant)) {
      focus = { part: 'frame', index: stagesOf(variant).length };
    } else if (/^[fa]\d+$/.test(parts[2] || '')) {
      focus = { part: parts[2][0] === 'a' ? 'arrow' : 'frame', index: parseInt(parts[2].slice(1), 10) };
    }
    return { flow: flowIndex, variant: variantIndex, stateWalk: -1, focus: fitFocus(focus, variant) };
  }

  function selectFlow(flowIndex) {
    if (flowIndex === state.flow) { return; }
    state.flow = flowIndex;
    state.variant = defaultVariantIndex(flows[flowIndex]);
    state.stateWalk = -1;
    state.focus = fitFocus(null, currentVariant());
    renderAll();
    canvas.scrollLeft = 0;
    canvas.scrollTop = 0;
    writeHash();
  }

  function selectVariant(variantIndex, focus) {
    var stateTarget = stateWalkTarget(currentFlow(), variantIndex);
    state.stateWalk = stateTarget ? variantIndex : -1;
    state.variant = stateTarget ? stateTarget.main : variantIndex;
    state.focus = fitFocus(stateTarget ? { part: 'frame', index: stateTarget.at } : (focus || state.focus), currentVariant());
    renderAll();
    writeHash();
    revealFocus(false);
  }

  function selectFrame(frame) {
    selectVariant(pickVariant(frame.through), { part: 'frame', index: frame.col });
  }

  function selectEdge(edge) {
    selectVariant(pickVariant(edge.through), { part: 'arrow', index: edge.depth });
  }

  function walk(delta) {
    var variant = currentVariant();
    var steps = walkSteps(variant);
    var position = stepPosition(steps, state.focus) + delta;
    if (position < 0 || position >= steps.length) { return false; }
    var wasInCanvas = canvas.contains(document.activeElement);
    state.focus = steps[position];
    renderAll();
    writeHash();
    revealFocus(true);
    if (wasInCanvas) {
      var target = focusedCanvasNode();
      if (target) { target.focus({ preventScroll: true }); }
    }
    return true;
  }

  window.addEventListener('hashchange', function () {
    var hashPage = pageOfHash();
    if (hashPage !== 'flows') { if (typeof showPage === 'function' && currentPage !== hashPage) { showPage(hashPage); } return; }
    if (typeof currentPage !== 'undefined' && currentPage !== 'flows') { showPage('flows'); }
    if (!flows.length || window.location.hash === hashFor()) { return; }
    var target = readHash();
    state.flow = target.flow;
    state.variant = target.variant;
    state.stateWalk = target.stateWalk;
    state.focus = target.focus;
    renderAll();
    writeHash();
    revealFocus(true);
  });

  /* ---------- rendering ---------- */

  function renderAll() {
    var active = document.activeElement;
    var activeKey = active && active.getAttribute ? active.getAttribute('data-key') : null;
    renderFlowTabs();
    renderToolbar();
    renderCanvas();
    renderInspector();
    if (activeKey) {
      var again = document.querySelector('[data-key="' + activeKey + '"]');
      if (again) { again.focus({ preventScroll: true }); }
    }
  }

  function renderEmpty() {
    flowTabs.textContent = '';
    toolbar.textContent = '';
    inspector.setAttribute('hidden', '');
    canvas.textContent = '';
    canvas.appendChild(copyNode('p', 'empty', atlasVersions.isFailed ? 'loadFailed' : 'empty'));
  }

  /* ---------- flow tabs ---------- */

  var AREA_KEY = STORE_PREFIX + '-group';
  var lastFlowByArea = {};
  var tabsTarget = null;

  function flowGroups() {
    var byName = {};
    flows.forEach(function (flow, index) { byName[flow.name] = index; });
    return (data.areas || []).map(function (area) {
      var groups = area.groups.map(function (group) {
        return {
          id: group.name,
          title: group.title,
          flows: group.flows.map(function (name) { return byName[name]; })
        };
      });
      var flat = [];
      groups.forEach(function (group) { flat = flat.concat(group.flows); });
      return { id: area.name, title: area.title, groups: groups, flows: flat };
    });
  }

  function currentGroup() {
    var groups = flowGroups();
    for (var i = 0; i < groups.length; i += 1) {
      if (includes(groups[i].flows, state.flow)) { return groups[i]; }
    }
    return groups[0];
  }

  function groupOfFlow(flowIndex) {
    return flowGroups().filter(function (group) { return includes(group.flows, flowIndex); })[0] || flowGroups()[0];
  }

  function firstFlowIndex() {
    var groups = flowGroups();
    var stored = null;
    try { stored = window.localStorage.getItem(AREA_KEY); } catch (e) { stored = null; }
    var group = groups.filter(function (g) { return g.id === stored && g.flows.length; })[0] ||
      groups[0];
    return group.flows[0] || 0;
  }

  function selectArea(group) {
    try { window.localStorage.setItem(AREA_KEY, group.id); } catch (e) { /* per-device convenience */ }
    var lastFlow = lastFlowByArea[group.id];
    selectFlow(includes(group.flows, lastFlow) ? lastFlow : group.flows[0]);
  }

  function renderAreaSwitch(current) {
    var box = document.getElementById('area-switch');
    if (!box) { return; }
    box.textContent = '';
    var seg = el('div', 'seg area-seg');
    seg.setAttribute('role', 'group');
    seg.setAttribute('aria-label', t('Area', 'Область'));
    flowGroups().forEach(function (group) {
      var button = el('button');
      button.type = 'button';
      button.setAttribute('aria-pressed', String(group.id === current.id));
      button.appendChild(el('span', null, localizedText(group.title, group.id)));
      var failing = 0;
      var hits = 0;
      group.flows.forEach(function (flowIndex) {
        failing += variantsOf(flows[flowIndex]).filter(isFailed).length;
        hits += isSearching() ? (search.perFlow[flowIndex] || 0) : 0;
      });
      if (isSearching()) {
        if (hits) { button.appendChild(el('span', 'search-hits', String(hits))); } else { button.classList.add('is-search-miss'); }
      } else if (failing) {
        var fail = el('span', 'area-fail', '✕' + failing);
        fail.title = t(failing + ' failing', failing + ' впало');
        button.appendChild(fail);
      }
      button.addEventListener('click', function () { if (group.id !== current.id) { selectArea(group); } });
      seg.appendChild(button);
    });
    box.appendChild(seg);
  }

  function renderFlowTabs() {
    flowTabs.textContent = '';
    tabsTarget = flowTabs;
    var current = currentGroup();
    if (!current) { return; }
    lastFlowByArea[current.id] = state.flow;
    try { window.localStorage.setItem(AREA_KEY, current.id); } catch (e) { /* per-device convenience */ }
    renderAreaSwitch(current);
    current.groups.forEach(function (flowGroup, index) {
      var group = el('div', 'flow-group' + (index === 0 ? ' is-first' : ''));
      group.setAttribute('role', 'presentation');
      var label = el('span', 'flow-group-label');
      label.appendChild(el('span', null, localizedText(flowGroup.title, flowGroup.id)));
      group.appendChild(label);
      var row = el('div', 'flow-group-tabs');
      row.setAttribute('role', 'presentation');
      group.appendChild(row);
      flowTabs.appendChild(group);
      tabsTarget = row;
      flowGroup.flows.forEach(function (flowIndex) {
        renderFlowTab(flows[flowIndex], flowIndex);
      });
      tabsTarget = flowTabs;
    });
  }

  function renderFlowTab(flow, flowIndex) {
    var variants = variantsOf(flow);
    var failing = variants.filter(isFailed).length;
    var tab = el('button', 'flow-tab');
    tab.type = 'button';
    tab.setAttribute('role', 'tab');
    tab.setAttribute('data-key', 'flow:' + flowIndex);
    tab.setAttribute('aria-selected', String(flowIndex === state.flow));
    tab.appendChild(localized('span', 'flow-tab-title', flow.title, flow.name));
    var meta = el('span', 'flow-tab-meta');
    meta.appendChild(copyNode('span', null, 'variantsCount', variants.length));
    if (failing) { meta.appendChild(copyNode('span', 'fail', 'failingCount', failing)); }
    tab.appendChild(meta);
    markSearchFlowTab(tab, flowIndex);
    tab.title = flow.name;
    tab.addEventListener('click', function () { selectFlow(flowIndex); });
    tabsTarget.appendChild(tab);
  }

  /* ---------- toolbar ---------- */

  function variantKindCount(variant, kind) {
    var count = 0;
    stagesOf(variant).forEach(function (stage) {
      count += countKind(stage.afterAction, kind) + countKind(stage.onScreenOpen, kind);
    });
    if (hasEnd(variant)) { count += countKind(endOf(variant).onScreenOpen, kind); }
    return count;
  }

  function renderToolbar() {
    toolbar.textContent = '';
    var variant = currentVariant();
    var row = el('div', 'toolbar-row');

    row.appendChild(variantSelect());

    var legends = el('div', 'kind-legends');
    legends.appendChild(copyNode('span', 'kind-legends-caption', 'variantTotals'));
    KINDS.forEach(function (kind) {
      legends.appendChild(kindLegend(kind, variantKindCount(variant, kind)));
    });
    row.appendChild(legends);
    toolbar.appendChild(row);
    var entries = entrySwitch();
    if (entries) { toolbar.appendChild(entries); }

    var about = el('p', 'variant-about');
    if (variant && hasText(variant.proves)) { about.appendChild(localized('span', 'proves', variant.proves, '')); }
    if (variant && seriesOf(variant).device) {
      var device = el('span', 'chip');
      device.appendChild(copyNode('span', null, 'device'));
      device.appendChild(document.createTextNode(' · ' + seriesOf(variant).device));
      about.appendChild(device);
    }
    if (about.childNodes.length) { toolbar.appendChild(about); }
  }

  var variantMenuOpen = false;

  function variantMark(variant) {
    return isFailed(variant) ? el('span', 'fail-mark', '✕') : el('span', 'ok-mark');
  }

  function variantSelect() {
    var variants = currentVariants();
    var current = currentVariant();
    var wrap = el('div', 'variant-pills vselect');
    if (!current) { return wrap; }
    var button = el('button', 'vselect-btn' + (isFailed(current) ? ' is-failed' : ''));
    button.type = 'button';
    button.setAttribute('data-key', 'variant-select');
    button.setAttribute('aria-haspopup', 'listbox');
    button.setAttribute('aria-expanded', String(variantMenuOpen));
    button.title = current.name;
    button.appendChild(el('span', 'vselect-caption', t('Variant', 'Варіант')));
    button.appendChild(variantMark(current));
    button.appendChild(localized('span', 'vselect-label', current.title, current.name));
    if (isFailed(current)) { button.appendChild(el('span', 'badge badge-fail', t('failed', 'впав'))); }
    button.appendChild(el('span', 'vselect-pos', (state.variant + 1) + '/' + variants.length));
    button.appendChild(el('span', 'vselect-caret', '▾'));
    wrap.appendChild(button);

    var list = el('div', 'vselect-list');
    list.setAttribute('role', 'listbox');
    if (!variantMenuOpen) { list.hidden = true; }
    variants.forEach(function (candidate, variantIndex) {
      list.appendChild(variantPill(candidate, variantIndex));
    });
    wrap.appendChild(list);

    function setOpen(open) {
      variantMenuOpen = open;
      button.setAttribute('aria-expanded', String(open));
      list.hidden = !open;
      if (open) {
        var sel = list.querySelector('[aria-selected="true"]') || list.firstChild;
        if (sel) { sel.focus({ preventScroll: true }); if (sel.scrollIntoView) { sel.scrollIntoView({ block: 'nearest' }); } }
      }
    }
    button.addEventListener('click', function () { setOpen(!variantMenuOpen); });
    button.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') { event.preventDefault(); setOpen(true); }
    });
    list.addEventListener('keydown', function (event) {
      var items = Array.prototype.slice.call(list.children);
      var at = items.indexOf(document.activeElement);
      if (event.key === 'Escape') { event.preventDefault(); setOpen(false); button.focus(); }
      else if (event.key === 'ArrowDown') { event.preventDefault(); items[Math.min(items.length - 1, at + 1)].focus(); }
      else if (event.key === 'ArrowUp') { event.preventDefault(); items[Math.max(0, at - 1)].focus(); }
      else if (event.key === 'Tab') { setOpen(false); }
    });
    return wrap;
  }

  document.addEventListener('click', function (event) {
    if (!variantMenuOpen) { return; }
    var box = document.querySelector('.vselect');
    if (box && box.contains(event.target)) { return; }
    variantMenuOpen = false;
    var list = document.querySelector('.vselect-list');
    var button = document.querySelector('.vselect-btn');
    if (list) { list.hidden = true; }
    if (button) { button.setAttribute('aria-expanded', 'false'); }
  });

  function variantPill(variant, variantIndex) {
    var failed = isFailed(variant);
    var pill = el('button', 'vpill vselect-item' + (failed ? ' is-failed' : ''));
    pill.type = 'button';
    pill.setAttribute('role', 'option');
    pill.setAttribute('data-key', 'variant:' + variantIndex);
    pill.setAttribute('aria-selected', String(variantIndex === state.variant));
    pill.title = variant.name;
    pill.appendChild(variantMark(variant));
    pill.appendChild(localized('span', 'vselect-label', variant.title, variant.name));
    if (failed) { pill.appendChild(el('span', 'badge badge-fail', t('failed', 'впав'))); }
    pill.addEventListener('click', function () {
      variantMenuOpen = false;
      selectVariant(variantIndex);
      var b = document.querySelector('.vselect-btn');
      if (b) { b.focus({ preventScroll: true }); }
    });
    return pill;
  }

  function kindLegend(kind, count) {
    var legend = el('span', 'kind-legend');
    legend.setAttribute('data-kind', kind);
    legend.appendChild(el('span', 'kind-swatch'));
    legend.appendChild(copyNode('span', null, 'kind_' + kind));
    legend.appendChild(el('span', 'kind-legend-count', String(count)));
    return legend;
  }

  /* ---------- canvas ---------- */

  var phoneQuery = typeof window.matchMedia === 'function' ? window.matchMedia('(max-width: 560px)') : null;
  var shotRatios = {};
  var shotSheetCrops = [];
  var pendingCanvasRender = false;

  function geometry(graph) {
    var isPhone = Boolean(phoneQuery && phoneQuery.matches);
    var frameWidth = isPhone ? 148 : 188;
    var geo = {
      frameWidth: frameWidth,
      shotHeight: Math.round(frameWidth / SHOT_RATIO),
      titleHeight: 28,
      infoHeight: 44,
      noteHeight: graph.hasEndNotes ? 52 : 0,
      rowGap: isPhone ? 12 : 16,
      colGap: isPhone ? 124 : 150,
      pad: isPhone ? 20 : 32,
      swipeLength: isPhone ? 30 : 40
    };
    geo.rowPitch = geo.titleHeight + geo.shotHeight + geo.infoHeight + geo.noteHeight + geo.rowGap;
    var endsInStub = graph.edges.some(function (edge) { return !edge.to && edge.from.col === graph.cols - 1; });
    geo.width = geo.pad * 2 + graph.cols * (geo.frameWidth + geo.colGap) - (endsInStub ? 0 : geo.colGap);
    geo.height = geo.pad * 2 + graph.rows * geo.rowPitch - geo.rowGap;
    return geo;
  }

  function frameBox(frame, geo) {
    var left = geo.pad + frame.col * (geo.frameWidth + geo.colGap);
    var top = geo.pad + frame.row * geo.rowPitch;
    return { left: left, top: top, right: left + geo.frameWidth, shotTop: top + geo.titleHeight };
  }

  function shotContent(hash, geo) {
    var boxWidth = geo.frameWidth - SHOT_BORDER * 2;
    var boxHeight = geo.shotHeight - SHOT_BORDER * 2;
    var full = { x: SHOT_BORDER, y: SHOT_BORDER, width: boxWidth, height: boxHeight };
    var ratio = shotRatios[hash];
    var boxRatio = boxWidth / boxHeight;
    if (!ratio || Math.abs(ratio - boxRatio) < 0.01) { return full; }
    if (ratio > boxRatio) {
      var height = boxWidth / ratio;
      return { x: SHOT_BORDER, y: SHOT_BORDER + (boxHeight - height) / 2, width: boxWidth, height: height };
    }
    var width = boxHeight * ratio;
    return { x: SHOT_BORDER + (boxWidth - width) / 2, y: SHOT_BORDER, width: width, height: boxHeight };
  }

  function memberData(frame, item) {
    var variantIndex = pickVariant(item.through);
    var variant = currentVariants()[variantIndex];
    return item.kind === 'end' ? endOf(variant) : stagesOf(variant)[frame.col];
  }

  function frameSubject(frame) {
    var variantIndex = pickVariant(frame.through);
    var item = frame.members.filter(function (member) { return includes(member.through, variantIndex); })[0];
    return { item: item, data: memberData(frame, item) };
  }

  function edgeStage(edge) {
    return stagesOf(currentVariants()[pickVariant(edge.through)])[edge.depth];
  }

  function focusedFrame(graph) {
    if (!state.focus || state.focus.part !== 'frame') { return null; }
    return graph.framesByVariant[state.variant][state.focus.index] || null;
  }

  function focusedEdge(graph) {
    if (!state.focus || state.focus.part !== 'arrow') { return null; }
    return graph.edgesByVariant[state.variant][state.focus.index] || null;
  }

  function stateCutCol() {
    var main = currentVariant();
    var walk = state.stateWalk === -1 ? null : currentVariants()[state.stateWalk];
    if (!main || !walk) { return -1; }
    var col = departIndex(main, walk);
    return includes(stateWalksAt(col), state.stateWalk) ? col : -1;
  }

  function isPastStateCut(col) {
    var cut = stateCutCol();
    return cut !== -1 && col >= cut;
  }

  function isFrameOnPath(frame) {
    var cut = stateCutCol();
    return includes(frame.through, state.variant) && (cut === -1 || frame.col <= cut);
  }

  function isEdgeOnPath(edge) {
    return includes(edge.through, state.variant) && !isPastStateCut(edge.from.col);
  }

  function renderCanvas() {
    var scrollLeft = canvas.scrollLeft;
    var scrollTop = canvas.scrollTop;
    var graph = graphOf(state.flow);
    var geo = geometry(graph);
    canvas.textContent = '';
    canvas.setAttribute('aria-label', localizedText(currentFlow().title, currentFlow().name));

    var content = el('div', 'graph');
    content.style.width = geo.width + 'px';
    content.style.height = geo.height + 'px';

    var svg = svgEl('svg', { 'class': 'edges', width: geo.width, height: geo.height, 'aria-hidden': 'true' });
    svg.appendChild(markers());
    content.appendChild(svg);

    var activeFrame = focusedFrame(graph);
    var activeEdge = focusedEdge(graph);
    graph.frames.forEach(function (frame) {
      content.appendChild(frameNode(frame, geo, frame === activeFrame, activeEdge));
    });

    var ordered = graph.edges.slice().sort(function (a, b) {
      return edgeWeight(a, activeEdge) - edgeWeight(b, activeEdge);
    });
    ordered.forEach(function (edge) {
      var route = edgeRoute(edge, graph, geo);
      svg.appendChild(markSearchEdge(edgePath(edge, route, edge === activeEdge), edge));
      content.appendChild(markSearchEdge(edgePill(edge, route, edge === activeEdge), edge));
      var info = edgeInfo(edge, route);
      if (info) { content.appendChild(markSearchEdge(info, edge)); }
    });

    var box = el('div', 'graph-box');
    box.appendChild(content);
    canvas.appendChild(box);
    applyZoom(content);
    canvas.scrollLeft = scrollLeft;
    canvas.scrollTop = scrollTop;
  }

  function scheduleCanvasRender() {
    if (pendingCanvasRender) { return; }
    pendingCanvasRender = true;
    window.requestAnimationFrame(function () {
      pendingCanvasRender = false;
      if (flows.length) { renderCanvas(); }
    });
  }

  function edgeWeight(edge, activeEdge) {
    if (edge === activeEdge) { return 2; }
    return isEdgeOnPath(edge) ? 1 : 0;
  }

  function markers() {
    var defs = svgEl('defs');
    [['idle', 'marker-idle'], ['on', 'marker-on'], ['fail', 'marker-fail']].forEach(function (pair) {
      var marker = svgEl('marker', {
        id: 'edge-head-' + pair[0],
        viewBox: '0 0 10 10',
        refX: '9',
        refY: '5',
        markerWidth: '9',
        markerHeight: '9',
        markerUnits: 'userSpaceOnUse',
        orient: 'auto'
      });
      marker.appendChild(svgEl('path', { d: 'M0 0L10 5L0 10z', 'class': pair[1] }));
      defs.appendChild(marker);
    });
    return defs;
  }

  function frameNode(frame, geo, isFocused, activeEdge) {
    var subject = frameSubject(frame);
    var frameData = subject.data || {};
    var isOnPath = isFrameOnPath(frame);
    var failed = subject.item.kind === 'stage' && frameData.ok === false;
    var box = frameBox(frame, geo);
    var node = el('div', 'frame' +
      (isOnPath ? ' is-on-path' : ' is-dim') +
      (isFocused ? ' is-focused' : '') +
      (failed ? ' is-failed' : ''));
    node.style.left = box.left + 'px';
    node.style.top = box.top + 'px';
    node.style.width = geo.frameWidth + 'px';
    markSearchFrame(node, frame);

    var head = frameHead(frameData, geo);
    head.addEventListener('click', function (event) {
      if (event.target.closest && event.target.closest('a')) { return; }
      selectFrame(frame);
    });
    node.appendChild(head);

    var shot = el('button', 'frame-shot');
    shot.type = 'button';
    shot.style.height = geo.shotHeight + 'px';
    shot.setAttribute('data-key', 'frame:' + frame.id);
    shot.setAttribute('aria-label', copyText(lang, 'opening') + ' ' + (frameData.designScreen || frameData.screen || ''));
    if (isFocused) { shot.setAttribute('aria-current', 'step'); }
    var isMainFrame = isOnPath && Boolean(subject.item);
    var shotData = isMainFrame ? shownFrame(frame.col, frameData) : frameData;
    appendShotImage(shot, shotData.shot, frameData.designScreen || frameData.screen);
    var marks = shotData === frameData ? shotMarks(frame, shotContent(shotData.shot, geo), geo, activeEdge) : null;
    if (marks) { shot.appendChild(marks); }
    var count = countKind(frameData.onScreenOpen, state.kind);
    if (count) { shot.appendChild(countBadge(state.kind, count)); }
    shot.addEventListener('click', function () { selectFrame(frame); });
    node.appendChild(shot);
    if (node.classList.contains('is-search-hit')) {
      var ring = el('span', 'frame-hit-ring');
      ring.style.top = geo.titleHeight + 'px';
      ring.style.height = geo.shotHeight + 'px';
      node.appendChild(ring);
    }
    var launch = frame.col === 0 ? launchBadge(currentVariants()[pickVariant(frame.through)], 'frame-launch') : null;
    if (launch) {
      launch.style.top = (geo.titleHeight + 8) + 'px';
      node.appendChild(launch);
    }
    node.appendChild(frameInfo(frame, frameData, geo));

    var notes = frameNotes(frame, isMainFrame ? stateSwitch(frame.col, 'frame-state') : null);
    if (notes) { node.appendChild(notes); }
    return node;
  }

  function frameInfo(frame, frameData, geo) {
    var info = el('div', 'frame-info');
    info.style.maxHeight = geo.infoHeight + 'px';
    if (frameData.screen && frameData.screen !== frameData.designScreen) {
      var route = el('span', 'frame-route', frameData.screen);
      route.title = frameData.screen;
      info.appendChild(route);
    }
    var dots = el('span', 'frame-dots');
    var records = recordsOf(frameData.onScreenOpen);
    KINDS.forEach(function (kind) {
      var n = countKind(records, kind);
      if (!n) { return; }
      var dot = el('span', 'frame-dot');
      dot.setAttribute('data-kind', kind);
      dot.title = copyText(lang, 'kind_' + kind) + ': ' + n;
      dot.appendChild(el('i'));
      dot.appendChild(document.createTextNode(String(n)));
      dots.appendChild(dot);
    });
    if (dots.childNodes.length) { info.appendChild(dots); }
    return info;
  }

  function frameHead(frameData, geo) {
    var head = el('div', 'frame-head');
    head.style.height = geo.titleHeight + 'px';
    var name = frameData.designScreen || frameData.screen || '—';
    var title = el('span', 'frame-title' + (frameData.designScreen ? '' : ' is-fallback'), name);
    title.title = [frameData.designScreen, frameData.screen].filter(Boolean).join(' · ');
    head.appendChild(title);
    if (isDesignUrl(frameData.designUrl)) {
      var link = el('a', 'frame-design');
      link.href = frameData.designUrl;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.title = copyText(lang, 'openDesign');
      link.setAttribute('aria-label', copyText(lang, 'openDesign'));
      link.appendChild(designIcon());
      head.appendChild(link);
    }
    return head;
  }

  function isDesignUrl(value) {
    return typeof value === 'string' && /^https?:\/\//.test(value);
  }

  function designIcon() {
    var svg = svgEl('svg', { width: '9', height: '13', viewBox: '0 0 12 18', 'aria-hidden': 'true' });
    svg.appendChild(svgEl('path', {
      fill: 'currentColor',
      d: 'M3 0h3v6H3a3 3 0 0 1 0-6zM6 0h3a3 3 0 0 1 0 6H6zM3 6h3v6H3a3 3 0 0 1 0-6zM9 6a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM3 12h3v3a3 3 0 1 1-3-3z'
    }));
    return svg;
  }

  function appendShotImage(holder, hash, label) {
    if (typeof hash !== 'string' || !hash) {
      holder.appendChild(shotPlaceholder());
      return;
    }
    var image = el('img');
    image.setAttribute('decoding', 'async');
    image.setAttribute('alt', label || '');
    image.setAttribute('draggable', 'false');
    image.addEventListener('load', function () {
      if (shotRatios[hash] || !image.naturalHeight) { return; }
      shotRatios[hash] = image.naturalWidth / image.naturalHeight;
      if (Math.abs(shotRatios[hash] - SHOT_RATIO) >= 0.01) { scheduleCanvasRender(); }
    });
    image.addEventListener('error', showPlaceholder);
    holder.appendChild(image);
    loadShotSource(hash).then(function (src) { image.setAttribute('src', src); }, showPlaceholder);

    function showPlaceholder() {
      if (image.parentNode !== holder) { return; }
      holder.replaceChild(shotPlaceholder(), image);
    }
  }

  function loadShotSource(hash) {
    if (data.shotUrlTemplate) { return Promise.resolve(data.shotUrlTemplate.split('{shot}').join(encodeURIComponent(hash))); }
    var cell = data.shotCells && data.shotCells[hash];
    if (!cell) { return Promise.resolve('shots/' + encodeURIComponent(hash) + '.png'); }
    return cropShotSheet(cell[0]).then(function (sources) { return sources[hash]; });
  }

  function cropShotSheet(sheetIndex) {
    if (!shotSheetCrops[sheetIndex]) {
      shotSheetCrops[sheetIndex] = decodeShotSheet(data.shotSheets[sheetIndex]).then(function (sheet) {
        return cropSheetCells(sheet, sheetIndex);
      });
    }
    return shotSheetCrops[sheetIndex];
  }

  function decodeShotSheet(source) {
    return new Promise(function (resolve, reject) {
      var sheet = new Image();
      sheet.onload = function () { resolve(sheet); };
      sheet.onerror = reject;
      sheet.src = source;
    });
  }

  function cropSheetCells(sheet, sheetIndex) {
    var hashes = Object.keys(data.shotCells).filter(function (hash) { return data.shotCells[hash][0] === sheetIndex; });
    return Promise.all(hashes.map(function (hash) { return cropShotCell(sheet, data.shotCells[hash]); })).then(function (sources) {
      var sourceByHash = {};
      hashes.forEach(function (hash, index) { sourceByHash[hash] = sources[index]; });
      return sourceByHash;
    });
  }

  function cropShotCell(sheet, cell) {
    var canvas = document.createElement('canvas');
    canvas.width = cell[3];
    canvas.height = cell[4];
    canvas.getContext('2d').drawImage(sheet, cell[1], cell[2], cell[3], cell[4], 0, 0, cell[3], cell[4]);
    return new Promise(function (resolve, reject) {
      canvas.toBlob(function (blob) {
        if (blob) { resolve(URL.createObjectURL(blob)); } else { reject(new Error('No crop of the shot sheet')); }
      }, 'image/png');
    });
  }

  function shotPlaceholder() {
    var placeholder = el('div', 'shot-empty');
    placeholder.appendChild(copyNode('span', null, 'noShot'));
    return placeholder;
  }

  function markPoint(stage, content) {
    var rect = validRect(stage.targetRect);
    if (rect) {
      return {
        x: content.x + (rect.left + rect.right) / 2 * content.width,
        y: content.y + (rect.top + rect.bottom) / 2 * content.height
      };
    }
    if (!scrollVector(stage)) { return null; }
    return { x: content.x + content.width / 2, y: content.y + content.height / 2 };
  }

  function shotMarks(frame, content, geo, activeEdge) {
    var svg = svgEl('svg', { 'class': 'shot-marks', width: geo.frameWidth, height: geo.shotHeight, 'aria-hidden': 'true' });
    var stageItems = frame.members.filter(function (item) { return item.kind === 'stage'; });
    stageItems.sort(function (a, b) {
      return Number(includes(a.through, state.variant)) - Number(includes(b.through, state.variant));
    });
    stageItems.forEach(function (item) {
      var stage = memberData(frame, item) || {};
      var point = markPoint(stage, content);
      if (!point) { return; }
      var isOnPath = includes(item.through, state.variant) && !isPastStateCut(frame.col);
      var isFocused = Boolean(activeEdge) && activeEdge.from === frame && isOnPath;
      svg.appendChild(tapMark(stage, point, geo, isOnPath, isFocused));
    });
    return svg.childNodes.length ? svg : null;
  }

  function tapMark(stage, point, geo, isOnPath, isFocused) {
    var failed = stage.ok === false;
    var mark = svgEl('g', {
      'class': 'tap-mark' +
        (isOnPath ? ' is-on-path' : '') +
        (isFocused ? ' is-focused' : '') +
        (failed ? ' is-failed' : '')
    });
    var ringRadius = isFocused ? 10 : 8.5;
    var vector = scrollVector(stage);
    if (vector) { mark.appendChild(swipeLine(point, vector, ringRadius, geo.swipeLength, markerHead(isOnPath, failed))); }
    mark.appendChild(svgEl('circle', { 'class': 'tap-ring', cx: round(point.x), cy: round(point.y), r: ringRadius }));
    mark.appendChild(svgEl('circle', { 'class': 'tap-dot', cx: round(point.x), cy: round(point.y), r: TAP_RADIUS }));
    return mark;
  }

  function swipeLine(point, vector, offset, length, head) {
    var size = Math.sqrt(vector.dx * vector.dx + vector.dy * vector.dy);
    var unitX = vector.dx / size;
    var unitY = vector.dy / size;
    return svgEl('path', {
      'class': 'swipe-line',
      d: 'M' + round(point.x + unitX * offset) + ' ' + round(point.y + unitY * offset) +
        'L' + round(point.x + unitX * (offset + length)) + ' ' + round(point.y + unitY * (offset + length)),
      'marker-end': 'url(#edge-head-' + head + ')'
    });
  }

  function markerHead(isOnPath, failed) {
    if (failed) { return 'fail'; }
    return isOnPath ? 'on' : 'idle';
  }

  function countBadge(kind, count) {
    var badge = el('span', 'count-badge kind-' + kind + '-bg', String(count));
    badge.title = copyText(lang, 'countTitle', kind, count);
    return badge;
  }

  function frameNotes(frame, stateBox) {
    var graph = graphOf(state.flow);
    if (!graph.hasEndNotes) { return null; }
    var ends = frame.members.filter(function (item) { return item.kind === 'end'; });
    var continuing = continuingVariants(frame);
    if (!ends.length && !stateBox && !continuing.length) { return null; }
    var notes = el('div', 'frame-ends');
    if (stateBox) { notes.appendChild(stateBox); }
    if (continuing.length) { notes.appendChild(continueNote(frame, continuing[0])); }
    var endNodes = ends.map(function (item) { return endNote(frame, item); });
    endNodes.sort(function (a, b) { return Number(b.classList.contains('is-on-path')) - Number(a.classList.contains('is-on-path')); });
    var hasOneEndRow = Boolean(stateBox) || continuing.length > 0;
    if (hasOneEndRow && endNodes.length > 1) {
      appendEndRow(notes, endNodes);
      return notes;
    }
    endNodes.forEach(function (note) { notes.appendChild(note); });
    if (endNodes.length > 2) { appendEndMore(notes, endNodes); }
    return notes;
  }

  function appendEndRow(notes, endNodes) {
    var row = el('div', 'end-row');
    row.appendChild(endNodes[0]);
    notes.appendChild(row);
    endNodes.slice(1).forEach(function (note) { notes.appendChild(note); });
    appendEndMore(notes, endNodes, true);
  }

  function continuingVariants(frame) {
    var endsHere = frame.members.some(function (item) { return item.kind === 'end' && item.variant === state.variant; });
    if (!endsHere) { return []; }
    return frame.members.reduce(function (through, item) {
      return item.kind === 'stage' ? through.concat(item.through) : through;
    }, []);
  }

  function continueNote(frame, variantIndex) {
    var variant = currentVariants()[variantIndex];
    var note = el('button', 'end-note is-continue');
    note.type = 'button';
    note.setAttribute('data-key', 'continue:' + frame.id + ':' + variantIndex);
    var text = localizedText(variant.title, variant.name) + ' · ' + copyText(lang, 'continuesHere');
    note.title = text;
    note.appendChild(el('span', 'end-note-text', text));
    note.addEventListener('click', function () {
      selectVariant(variantIndex, { part: 'frame', index: frame.col });
    });
    return note;
  }

  function endNote(frame, item) {
    var variant = currentVariants()[item.variant];
    var note = el('button', 'end-note' + (item.variant === state.variant ? ' is-on-path' : ''));
    note.type = 'button';
    note.setAttribute('data-key', 'end:' + frame.id + ':' + item.variant);
    var text = localizedText(variant.title, variant.name) + ' · ' + copyText(lang, 'endsHere');
    note.title = text;
    note.appendChild(el('span', 'end-note-text', text));
    note.addEventListener('click', function () {
      selectVariant(item.variant, { part: 'frame', index: frame.col });
    });
    return note;
  }

  function appendEndMore(notes, endNodes, isShort) {
    endNodes.slice(1).forEach(function (node) { node.classList.add('is-extra'); });
    var rest = endNodes.length - 1;
    var more = el('button', 'end-more');
    more.type = 'button';
    more.appendChild(endMoreLabel(rest, isShort));
    more.addEventListener('click', function (event) {
      event.stopPropagation();
      var open = !notes.classList.contains('is-open');
      notes.classList.toggle('is-open', open);
      notes.parentNode.classList.toggle('has-open-ends', open);
      more.textContent = '';
      more.appendChild(open ? bilingual('span', null, 'Collapse', 'Згорнути') : endMoreLabel(rest, isShort));
    });
    endNodes[0].after(more);
  }

  function endMoreLabel(rest, isShort) {
    if (isShort) { return el('span', null, '+' + rest); }
    return bilingual('span', null, '+' + rest + ' more end here', '+' + rest + ' ще закінчуються тут');
  }

  /* ---------- arrows ---------- */

  function edgeRoute(edge, graph, geo) {
    var from = frameBox(edge.from, geo);
    var stage = edgeStage(edge) || {};
    var point = markPoint(stage, shotContent(frameSubject(edge.from).data.shot, geo));
    var startX = from.right;
    var startY = from.shotTop + geo.shotHeight / 2;
    if (point) {
      startX = from.left + point.x + TAP_RADIUS + 1;
      startY = from.shotTop + point.y;
    }

    if (!edge.to) {
      var stubEnd = from.right + geo.colGap - 28;
      return {
        path: 'M' + round(startX) + ' ' + round(startY) + 'H' + round(stubEnd),
        pillX: (from.right + stubEnd) / 2,
        pillY: startY,
        pillWidth: stubEnd - from.right - 16
      };
    }

    var laneX = from.right + 18 + laneIndex(edge, graph) * 14;
    var to = frameBox(edge.to, geo);
    var endX = to.left - 2;
    var endY = to.shotTop + geo.shotHeight / 2;
    return {
      path: elbowPath(startX, startY, laneX, endX, endY),
      pillX: (laneX + endX) / 2,
      pillY: endY,
      pillWidth: endX - laneX - 14
    };
  }

  function laneIndex(edge, graph) {
    var outgoing = graph.edges.filter(function (candidate) { return candidate.from === edge.from && candidate.to; });
    outgoing.sort(function (a, b) { return a.to.row - b.to.row; });
    return outgoing.indexOf(edge);
  }

  function elbowPath(startX, startY, laneX, endX, endY) {
    var deltaY = endY - startY;
    if (Math.abs(deltaY) < 1) {
      return 'M' + round(startX) + ' ' + round(startY) + 'H' + round(endX);
    }
    var direction = deltaY > 0 ? 1 : -1;
    var radius = Math.max(0, Math.min(10, Math.abs(deltaY) / 2, laneX - startX, endX - laneX));
    return 'M' + round(startX) + ' ' + round(startY) +
      'H' + round(laneX - radius) +
      'Q' + round(laneX) + ' ' + round(startY) + ' ' + round(laneX) + ' ' + round(startY + direction * radius) +
      'V' + round(endY - direction * radius) +
      'Q' + round(laneX) + ' ' + round(endY) + ' ' + round(laneX + radius) + ' ' + round(endY) +
      'H' + round(endX);
  }

  function isDashedAction(action) {
    return action === 'scroll' || action === 'enterText';
  }

  function edgePath(edge, route, isFocused) {
    var stage = edgeStage(edge) || {};
    var isOnPath = isEdgeOnPath(edge);
    var failed = stage.ok === false;
    var head = markerHead(isOnPath, failed);
    return svgEl('path', {
      d: route.path,
      'class': 'edge' +
        (isOnPath ? ' is-on-path' : '') +
        (failed ? ' is-failed' : '') +
        (isDashedAction(stage.action) ? ' is-dashed' : '') +
        (isFocused ? ' is-focused' : ''),
      'marker-end': 'url(#edge-head-' + head + ')'
    });
  }

  function actionGlyph(stage) {
    if (stage.action === 'scroll') {
      var vector = scrollVector(stage);
      return vector && Math.abs(vector.dx) > Math.abs(vector.dy) ? '↔' : '↕';
    }
    if (stage.action === 'enterText') { return '⌨'; }
    return '';
  }

  function arrowLabel(stage, language) {
    var vector = scrollVector(stage);
    var fallback = vector ? copyText(language, 'scroll_' + scrollDirection(vector)) : stage.label || stage.action || '';
    return localizedText(stage.title, fallback, language);
  }

  function edgeInfo(edge, route) {
    var stage = edgeStage(edge) || {};
    var records = recordsOf(stage.afterAction);
    var kinds = KINDS.filter(function (kind) { return countKind(records, kind) > 0; });
    if (!kinds.length) { return null; }
    var info = el('div', 'edge-info' + (isEdgeOnPath(edge) ? ' is-on-path' : ''));
    info.setAttribute('aria-hidden', 'true');
    info.style.left = round(route.pillX) + 'px';
    info.style.top = round(route.pillY + 14) + 'px';
    kinds.forEach(function (kind) {
      var n = countKind(records, kind);
      var dot = el('span', 'frame-dot');
      dot.setAttribute('data-kind', kind);
      dot.title = copyText(lang, 'kind_' + kind) + ': ' + n;
      dot.appendChild(el('i'));
      dot.appendChild(document.createTextNode(String(n)));
      info.appendChild(dot);
    });
    return info;
  }

  function edgePill(edge, route, isFocused) {
    var stage = edgeStage(edge) || {};
    var count = countKind(stage.afterAction, state.kind);
    var pill = el('button', 'edge-pill' +
      (isEdgeOnPath(edge) ? ' is-on-path' : '') +
      (stage.ok === false ? ' is-failed' : '') +
      (isFocused ? ' is-focused' : '') +
      (count ? '' : ' has-no-badge'));
    pill.type = 'button';
    pill.setAttribute('data-key', 'edge:' + edge.id);
    pill.style.left = round(route.pillX) + 'px';
    pill.style.top = round(route.pillY) + 'px';
    pill.style.maxWidth = Math.max(48, Math.round(route.pillWidth)) + 'px';
    var label = arrowLabel(stage, lang);
    pill.title = [label, stage.label, stage.action].filter(function (part, index, parts) {
      return Boolean(part) && parts.indexOf(part) === index;
    }).join(' · ');
    pill.setAttribute('aria-label', arrowHeadingText(stage, lang));
    if (isFocused) { pill.setAttribute('aria-current', 'step'); }
    var glyph = actionGlyph(stage);
    if (glyph) { pill.appendChild(el('span', 'edge-pill-glyph', glyph)); }
    pill.appendChild(el('span', 'edge-pill-label', label));
    if (count) { pill.appendChild(countBadge(state.kind, count)); }
    pill.addEventListener('click', function () { selectEdge(edge); });
    return pill;
  }

  function focusedCanvasNode() {
    return canvas.querySelector('.frame.is-focused .frame-shot, .edge-pill.is-focused');
  }

  function revealFocus(withPage) {
    var node = focusedCanvasNode();
    if (!node) { return; }
    var frame = node.classList.contains('frame-shot') ? node.parentNode : node;
    /* rects instead of offsets, so the reveal holds under the scale transform */
    var canvasRect = canvas.getBoundingClientRect();
    var frameRect = frame.getBoundingClientRect();
    var left = frameRect.left - canvasRect.left + canvas.scrollLeft;
    var width = frameRect.width;
    var margin = 24;
    if (left < canvas.scrollLeft + margin || left + width > canvas.scrollLeft + canvas.clientWidth - margin) {
      canvas.scrollLeft = Math.max(0, left - (canvas.clientWidth - width) / 2);
    }
    var top = frameRect.top - canvasRect.top + canvas.scrollTop;
    var height = node.getBoundingClientRect().height;
    if (top < canvas.scrollTop || top + height > canvas.scrollTop + canvas.clientHeight) {
      canvas.scrollTop = Math.max(0, top - margin);
    }
    if (withPage && typeof node.scrollIntoView === 'function') {
      node.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }
  }

  /* ---------- canvas panning ---------- */

  var pan = null;

  canvas.addEventListener('pointerdown', function (event) {
    if (event.pointerType !== 'mouse' || event.button !== 0) { return; }
    if (event.target.closest && event.target.closest('button, a')) { return; }
    pan = { x: event.clientX, y: event.clientY, left: canvas.scrollLeft, top: canvas.scrollTop, id: event.pointerId, isMoving: false };
  });

  canvas.addEventListener('pointermove', function (event) {
    if (!pan || event.pointerId !== pan.id) { return; }
    var deltaX = event.clientX - pan.x;
    var deltaY = event.clientY - pan.y;
    if (!pan.isMoving && Math.abs(deltaX) + Math.abs(deltaY) < 5) { return; }
    if (!pan.isMoving) {
      pan.isMoving = true;
      canvas.classList.add('is-panning');
      if (canvas.setPointerCapture) { canvas.setPointerCapture(event.pointerId); }
    }
    canvas.scrollLeft = pan.left - deltaX;
    canvas.scrollTop = pan.top - deltaY;
  });

  function endPan() {
    pan = null;
    canvas.classList.remove('is-panning');
  }

  canvas.addEventListener('pointerup', endPan);
  canvas.addEventListener('pointercancel', endPan);

  /* ---------- inspector ---------- */

  function currentSubject() {
    var variant = currentVariant();
    var focus = state.focus;
    if (!variant || !focus) { return null; }
    var stages = stagesOf(variant);
    if (focus.part === 'arrow') {
      var stage = stages[focus.index] || {};
      return { part: 'arrow', variant: variant, stage: stage, records: recordsOf(stage.afterAction) };
    }
    var frameData = focus.index < stages.length ? stages[focus.index] : endOf(variant);
    frameData = shownFrame(focus.index, frameData || {});
    return { part: 'frame', variant: variant, frame: frameData, records: recordsOf(frameData.onScreenOpen) };
  }

  var SECTIONS = ['screen'].concat(KINDS, HAS_KEYS ? ['locale'] : []);

  function renderInspector() {
    inspector.textContent = '';
    inspector.removeAttribute('hidden');
    var subject = currentSubject();
    if (!subject) {
      inspector.setAttribute('hidden', '');
      return;
    }
    inspector.appendChild(inspectorHead(subject));
    var sections = subject.part === 'frame' ? SECTIONS : SECTIONS.filter(function (id) { return id !== 'locale'; });
    sections.forEach(function (id) { inspector.appendChild(inspectorSection(id, subject)); });
  }

  function placeZoomHud() {
    var hud = document.querySelector('.zoom-hud');
    if (!hud) { return; }
    var barX = Math.max(0, canvas.offsetWidth - canvas.clientWidth - 2);
    var barY = Math.max(0, canvas.offsetHeight - canvas.clientHeight - 2);
    hud.style.right = (16 + barX) + 'px';
    hud.style.bottom = (16 + barY) + 'px';
  }

  window.addEventListener('resize', placeZoomHud);

  function inspectorHead(subject) {
    var head = el('div', 'insp-head');
    var top = el('div', 'insp-top');
    top.appendChild(localized('p', 'insp-kicker', subject.variant.title, subject.variant.name));

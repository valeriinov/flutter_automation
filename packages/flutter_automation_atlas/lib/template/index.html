    top.appendChild(inspectorNav());
    head.appendChild(top);

    var title = el('h3', 'insp-title');
    if (subject.part === 'frame') {
      title.appendChild(el('code', null, subject.frame.designScreen || subject.frame.screen || ''));
      head.appendChild(title);
      var description = (data.screenDescriptions || {})[subject.frame.designScreen];
      if (hasText(description)) { head.appendChild(localized('p', 'insp-desc', description, '')); }
      return head;
    }

    title.appendChild(bilingual('span', null, arrowHeadingText(subject.stage, 'en'), arrowHeadingText(subject.stage, 'uk')));
    head.appendChild(title);
    if (isDashedAction(subject.stage.action) && arrowLabel(subject.stage, lang)) {
      head.appendChild(bilingual('p', 'insp-sub', arrowLabel(subject.stage, 'en'), arrowLabel(subject.stage, 'uk')));
    }
    if (subject.stage.ok === false) { head.appendChild(copyNode('span', 'badge badge-fail', 'failed')); }
    return head;
  }

  function arrowHeadingText(stage, language) {
    if (stage.action === 'tap') { return copyText(language, 'afterTap', arrowLabel(stage, language)); }
    if (stage.action === 'scroll') { return copyText(language, 'afterScroll'); }
    if (stage.action === 'enterText') { return copyText(language, 'afterEnterText'); }
    return copyText(language, 'afterOther', arrowLabel(stage, language));
  }

  function inspectorNav() {
    var steps = walkSteps(currentVariant());
    var position = stepPosition(steps, state.focus);
    var nav = el('span', 'insp-nav');
    [['previous', '←', -1], ['next', '→', 1]].forEach(function (entry) {
      var button = el('button', null, entry[1]);
      button.type = 'button';
      button.setAttribute('data-key', 'nav:' + entry[0]);
      button.title = copyText(lang, entry[0]);
      button.setAttribute('aria-label', copyText(lang, entry[0]));
      var target = position + entry[2];
      button.disabled = target < 0 || target >= steps.length;
      button.addEventListener('click', function () { walk(entry[2]); });
      nav.appendChild(button);
    });
    return nav;
  }

  function inspectorSection(id, subject) {
    var section = el('section', 'insp-section');
    var isOpen = Boolean(state.open[id]);
    var count = sectionCount(id, subject);
    var toggle = el('button', 'insp-toggle' + (count === 0 ? ' is-empty' : ''));
    toggle.type = 'button';
    toggle.setAttribute('data-key', 'section:' + id);
    toggle.setAttribute('aria-expanded', String(isOpen));
    if (id !== 'screen') { toggle.setAttribute('data-kind', id); }
    toggle.innerHTML = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 2l3 3-3 3"></path></svg>';
    toggle.appendChild(sectionTitle(id, subject));
    if (count !== null) { toggle.appendChild(el('span', 'insp-count', String(count))); }
    toggle.addEventListener('click', function () {
      state.open[id] = !isOpen;
      var isCanvasKindChanged = !isOpen && KINDS.indexOf(id) >= 0 && state.kind !== id;
      if (isCanvasKindChanged) { state.kind = id; }
      if (isCanvasKindChanged && !(mobileQuery && mobileQuery.matches)) { renderAll(); } else { renderInspector(); }
      var renderedToggle = inspector.querySelector('[data-key="section:' + id + '"]');
      if (renderedToggle) { renderedToggle.focus({ preventScroll: true }); }
    });
    section.appendChild(toggle);
    if (!isOpen) { return section; }
    var body = el('div', 'insp-body');
    body.appendChild(sectionBody(id, subject));
    section.appendChild(body);
    return section;
  }

  function sectionTitle(id, subject) {
    if (id === 'screen') {
      return subject.part === 'frame' ? copyNode('span', 'insp-toggle-label', 'screenTab') : bilingual('span', 'insp-toggle-label', 'Details', 'Деталі');
    }
    if (id === 'locale') { return bilingual('span', 'insp-toggle-label', 'Localization', 'Локалізація'); }
    return copyNode('span', 'insp-toggle-label', 'kind_' + id);
  }

  function sectionCount(id, subject) {
    if (id === 'screen') { return null; }
    if (id === 'locale') { return frameKeysOf(subject.frame).length; }
    return countKind(subject.records, id);
  }

  function sectionBody(id, subject) {
    if (id === 'locale') { return localePanel(subject.frame); }
    if (id !== 'screen') { return recordsPanel(subject.records, id); }
    var details = document.createDocumentFragment();
    details.appendChild(subject.part === 'arrow' ? arrowDetails(subject) : frameDetails(subject));
    appendMock(details, subject.variant);
    return details;
  }

  /* ---------- screen details ---------- */

  function kvRow(list, labelKey, content) {
    list.appendChild(copyNode('dt', null, labelKey));
    var value = el('dd');
    value.appendChild(content);
    list.appendChild(value);
  }

  function frameDetails(subject) {
    var frameData = subject.frame;
    var list = el('dl', 'kv');
    if (frameData.screen) { kvRow(list, 'screenName', el('code', null, frameData.screen)); }
    if (frameData.designScreen || isDesignUrl(frameData.designUrl)) {
      var design = document.createDocumentFragment();
      if (frameData.designScreen) { design.appendChild(el('code', null, frameData.designScreen)); }
      if (isDesignUrl(frameData.designUrl)) { design.appendChild(designLink(frameData.designUrl)); }
      kvRow(list, 'designScreen', design);
    }
    if (typeof frameData.shot === 'string' && frameData.shot) {
      var open = el('button', 'link-btn');
      open.type = 'button';
      open.setAttribute('data-key', 'open-shot');
      open.appendChild(copyNode('span', null, 'openShot'));
      open.addEventListener('click', function () {
        var caption = [frameData.designScreen, frameData.screen].filter(Boolean).join(' · ');
        openLightbox(frameData.shot, caption, caption);
      });
      kvRow(list, 'screenshot', open);
    }
    return list;
  }

  function arrowDetails(subject) {
    var stage = subject.stage;
    var list = el('dl', 'kv');
    if (stage.action) { kvRow(list, 'action', el('code', null, stage.action)); }
    if (isPlainObject(stage.target)) { kvRow(list, 'element', el('code', null, describeFinder(stage.target))); }
    if (stage.block) { kvRow(list, 'block', el('code', null, stage.block)); }
    if (stage.screen) { kvRow(list, 'screenName', el('code', null, stage.screen)); }
    if (stage.ok === false && stage.error) { kvRow(list, 'error', el('pre', 'stage-error', formatValue(stage.error))); }
    return list;
  }

  function designLink(url) {
    var link = el('a', 'design-link');
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.appendChild(copyNode('span', null, 'design'));
    return link;
  }

  function appendMock(panel, variant) {
    if (!isPlainObject(variant.scenario) || !Object.keys(variant.scenario).length) { return; }
    var details = el('details', 'more');
    var summary = el('summary');
    summary.appendChild(copyNode('span', null, 'scenario'));
    details.appendChild(summary);
    details.appendChild(jsonBlock(variant.scenario));
    panel.appendChild(details);
  }

  function describeFinder(finder) {
    if (!isPlainObject(finder)) { return ''; }
    var by = finder.by;
    if (by === 'descendant' || by === 'ancestor') {
      return by + '(of: ' + describeFinder(finder.of) +
        ', matching: ' + describeFinder(finder.matching) +
        (finder.matchRoot === true ? ', matchRoot' : '') + ')';
    }
    if (by === 'pageBack') { return 'pageBack'; }
    if (isPlainObject(finder.value)) { return by + ' ' + describeLocalizedFinderValue(finder.value); }
    if (by === 'text') { return 'text ' + JSON.stringify(String(finder.value)); }
    if (by === 'valueKey' || by === 'type' || by === 'tooltip' || by === 'localeKey' || by === 'localeKeyTooltip') { return by + ' ' + finder.value; }
    return stableJson(finder);
  }

  function describeLocalizedFinderValue(value) {
    return Object.keys(value).map(function (locale) {
      return locale + ' ' + JSON.stringify(String(value[locale]));
    }).join(' · ');
  }

  /* ---------- records ---------- */

  function recordsPanel(records, kind) {
    var matching = records.filter(function (record) { return record && record.kind === kind; });
    if (!matching.length) { return copyNode('p', 'insp-empty', 'nothingHappened'); }
    var list = el('ol', 'recs');
    if (kind === JOURNAL.analytics) {
      analyticsGroups(matching).forEach(function (group) { list.appendChild(analyticsItem(group)); });
    } else if (kind === JOURNAL.state) {
      stateChains(matching).forEach(function (chain) { list.appendChild(stateItem(chain)); });
    } else {
      matching.forEach(function (record) { list.appendChild(callItem(record, kind)); });
    }
    return list;
  }

  function callItem(record, kind) {
    var item = el('li', 'rec rec-' + kind);
    var line = el('summary', 'rec-line');
    line.appendChild(el('span', 'rec-method', formatValue(record.method || '')));
    line.appendChild(el('code', 'rec-path', formatValue(record.path || '')));
    if (kind === JOURNAL.requests[0] || typeof record.status === 'number') { line.appendChild(statusNode(record.status)); }
    var details = el('details', 'rec-expand');
    details.appendChild(line);
    details.appendChild(requestSection(record));
    details.appendChild(responseSection(record));
    item.appendChild(details);
    if (record.path) { item.appendChild(findButton(normalizePath(record.path), kind, [kind, kind])); }
    item.appendChild(clipboardButton(record));
    return item;
  }

  function requestSection(record) {
    var section = el('div', 'rec-section');
    section.appendChild(copyNode('p', 'rec-section-title', 'requestBlock'));
    var hasQuery = !isEmptyPayload(record.query);
    var hasBody = !isEmptyPayload(record.body);
    if (hasQuery) {
      section.appendChild(copyNode('p', 'rec-label', 'query'));
      section.appendChild(jsonBlock(record.query));
    }
    if (hasBody) {
      section.appendChild(copyNode('p', 'rec-label', 'body'));
      section.appendChild(jsonBlock(record.body));
    }
    if (!hasQuery && !hasBody) { section.appendChild(copyNode('p', 'rec-none', 'noBody')); }
    return section;
  }

  function responseSection(record) {
    var section = el('div', 'rec-section');
    section.appendChild(copyNode('p', 'rec-section-title', 'responseBlock'));
    var hasResponse = record.response !== undefined && record.response !== null && record.response !== '';
    section.appendChild(hasResponse ? jsonBlock(record.response) : copyNode('p', 'rec-none', 'noResponseBody'));
    return section;
  }

  function statusNode(status) {
    if (typeof status !== 'number') { return copyNode('span', 'rec-status status-none', 'noStatus'); }
    var tone = 'status-other';
    if (status >= 200 && status < 300) { tone = 'status-ok'; }
    if (status >= 400) { tone = 'status-fail'; }
    return el('span', 'rec-status ' + tone, String(status));
  }

  function isEmptyPayload(value) {
    if (value === undefined || value === null || value === '') { return true; }
    return isPlainObject(value) && !Object.keys(value).length;
  }

  function jsonBlock(value) {
    return el('pre', 'rec-json', typeof value === 'string' ? value : JSON.stringify(value, null, 2));
  }

  function analyticsGroups(records) {
    var groups = [];
    records.forEach(function (record) {
      var last = groups[groups.length - 1];
      if (last && last.name === record.name) {
        last.records.push(record);
        return;
      }
      groups.push({ name: record.name, records: [record] });
    });
    return groups;
  }

  function analyticsItem(group) {
    var item = el('li', 'rec rec-analytics');
    var line = el('div', 'rec-line');
    line.appendChild(el('code', 'rec-name', formatValue(group.name || '')));
    group.records.forEach(function (record) { line.appendChild(targetChip(record.target)); });
    item.appendChild(line);
    var table = parametersTable(group.records);
    if (table) { item.appendChild(table); }
    if (group.name) { item.appendChild(findButton(group.name, JOURNAL.analytics, ['event', 'подію'])); }
    item.appendChild(clipboardButton(group.records.length === 1 ? group.records[0] : group.records));
    return item;
  }

  function targetChip(target) {
    var text = formatValue(target || '?');
    return el('span', 'chip', text);
  }

  function parametersTable(records) {
    var keys = [];
    records.forEach(function (record) {
      if (!isPlainObject(record[JOURNAL.parametersKey])) { return; }
      Object.keys(record[JOURNAL.parametersKey]).forEach(function (key) {
        if (!includes(keys, key)) { keys.push(key); }
      });
    });
    if (!keys.length) { return null; }
    var table = el('table', 'params');
    var body = el('tbody');
    keys.forEach(function (key) {
      var row = el('tr');
      var name = el('th', null, key);
      name.setAttribute('scope', 'row');
      row.appendChild(name);
      var cell = el('td');
      parameterValues(records, key).forEach(function (entry) { cell.appendChild(entry); });
      row.appendChild(cell);
      body.appendChild(row);
    });
    table.appendChild(body);
    return table;
  }

  function parameterValues(records, key) {
    var holders = records.filter(function (record) {
      return isPlainObject(record[JOURNAL.parametersKey]) && Object.prototype.hasOwnProperty.call(record[JOURNAL.parametersKey], key);
    });
    var distinct = [];
    holders.forEach(function (record) {
      var value = stableJson(record[JOURNAL.parametersKey][key]);
      var known = distinct.filter(function (entry) { return entry.json === value; })[0];
      if (known) {
        known.targets.push(record.target);
        return;
      }
      distinct.push({ json: value, value: record[JOURNAL.parametersKey][key], targets: [record.target] });
    });
    var isShared = distinct.length === 1 && holders.length === records.length;
    return distinct.map(function (entry) {
      var line = el('div', 'param-value');
      line.appendChild(el('span', null, formatValue(entry.value)));
      if (!isShared) {
        entry.targets.forEach(function (target) { line.appendChild(targetChip(target)); });
      }
      return line;
    });
  }

  function stateChains(records) {
    var chains = [];
    var byOwner = {};
    records.forEach(function (record) {
      var owner = formatValue(record[JOURNAL.stateKey] || '');
      if (!Object.prototype.hasOwnProperty.call(byOwner, owner)) {
        byOwner[owner] = { owner: owner, steps: [] };
        chains.push(byOwner[owner]);
      }
      byOwner[owner].steps.push(record);
    });
    return chains;
  }

  function shortStatus(owner, status) {
    return formatValue(status || '');
  }

  function stateItem(chain) {
    var item = el('li', 'rec rec-state');
    item.appendChild(el('code', 'rec-owner', chain.owner));
    var steps = el('ol', 'state-chain');
    chain.steps.forEach(function (record) {
      var step = el('li', 'state-step');
      if (record[JOURNAL.createdKey] === true) {
        step.appendChild(copyNode('span', 'state-created', 'created'));
        steps.appendChild(step);
        return;
      }
      var name = el('span', 'state-name', shortStatus(chain.owner, record.status));
      name.title = formatValue(record.status || '');
      step.appendChild(name);
      if (record.isLoading === true) { step.appendChild(copyNode('span', 'flag flag-loading', 'loading')); }
      if (record.error) {
        var flag = el('span', 'flag flag-error');
        flag.appendChild(copyNode('span', null, 'error'));
        flag.appendChild(document.createTextNode(': ' + formatValue(record.error)));
        step.appendChild(flag);
      }
      steps.appendChild(step);
    });
    item.appendChild(steps);
    item.appendChild(clipboardButton(chain.steps));
    return item;
  }

  /* ---------- clipboard ---------- */

  var CLIPBOARD_RESULT_MS = 1500;
  var CLIPBOARD_ICON = 'M9 9h10v10H9z M5 15V5h10';
  var CLIPBOARD_DONE_ICON = 'M5 12.5l4.5 4.5L19 7.5';

  function clipboardButton(value) {
    var button = el('button', 'rec-clip');
    button.type = 'button';
    var icon = svgEl('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true' });
    var path = svgEl('path', { d: CLIPBOARD_ICON });
    icon.appendChild(path);
    button.appendChild(icon);
    labelClipboardButton(button, 'copyRecord');
    button.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();
      writeClipboard(JSON.stringify(value, null, 2), function (isCopied) {
        showClipboardResult(button, path, isCopied);
      });
    });
    return button;
  }

  function labelClipboardButton(button, key) {
    button.title = copyText(lang, key);
    button.setAttribute('aria-label', copyText(lang, key));
  }

  function writeClipboard(text, done) {
    if (!navigator.clipboard || !window.isSecureContext) {
      done(copyThroughSelection(text));
      return;
    }
    navigator.clipboard.writeText(text).then(
      function () { done(true); },
      function () { done(copyThroughSelection(text)); }
    );
  }

  /* A page opened from a plain http host is not a secure context, so the Clipboard API is absent there. */
  function copyThroughSelection(text) {
    var area = el('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.top = '0';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    var isCopied = false;
    try {
      isCopied = document.execCommand('copy');
    } catch (error) {
      isCopied = false;
    }
    document.body.removeChild(area);
    return isCopied;
  }

  function showClipboardResult(button, path, isCopied) {
    button.classList.toggle('is-copied', isCopied);
    button.classList.toggle('is-failed', !isCopied);
    path.setAttribute('d', isCopied ? CLIPBOARD_DONE_ICON : CLIPBOARD_ICON);
    labelClipboardButton(button, isCopied ? 'recordCopied' : 'recordCopyFailed');
    window.clearTimeout(button.clipboardResetTimer);
    button.clipboardResetTimer = window.setTimeout(function () {
      button.classList.remove('is-copied', 'is-failed');
      path.setAttribute('d', CLIPBOARD_ICON);
      labelClipboardButton(button, 'copyRecord');
    }, CLIPBOARD_RESULT_MS);
  }

  /* ---------- lightbox ---------- */

  var lightbox = document.getElementById('lightbox');
  var lightboxImage = document.getElementById('lightbox-image');
  var lightboxCaption = document.getElementById('lightbox-caption');
  var lightboxClose = document.getElementById('lightbox-close');
  var lightboxReturn = null;

  function openLightbox(hash, label, caption) {
    lightboxReturn = document.activeElement;
    loadShotSource(hash).then(function (src) {
      if (!lightbox.hasAttribute('hidden')) { lightboxImage.setAttribute('src', src); }
    });
    lightboxImage.setAttribute('alt', label || '');
    lightboxCaption.textContent = caption || '';
    lightbox.removeAttribute('hidden');
    document.body.classList.add('is-locked');
    lightboxClose.focus();
  }

  function closeLightbox() {
    if (lightbox.hasAttribute('hidden')) { return; }
    lightbox.setAttribute('hidden', '');
    lightboxImage.removeAttribute('src');
    document.body.classList.remove('is-locked');
    if (lightboxReturn && document.body.contains(lightboxReturn)) { lightboxReturn.focus(); }
  }

  lightbox.addEventListener('click', function (event) {
    if (event.target !== lightboxImage) { closeLightbox(); }
  });

  /* ---------- keyboard ---------- */

  function isTypingTarget(target) {
    if (!target || !target.tagName) { return false; }
    return /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName) || target.isContentEditable === true;
  }

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      closeLightbox();
      return;
    }
    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') { return; }
    if (!flows.length || !lightbox.hasAttribute('hidden')) { return; }
    if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || isTypingTarget(event.target)) { return; }
    if (walk(event.key === 'ArrowRight' ? 1 : -1)) { event.preventDefault(); }
  });

  if (phoneQuery) {
    var onBreakpoint = function () { if (flows.length) { renderCanvas(); } };
    if (typeof phoneQuery.addEventListener === 'function') {
      phoneQuery.addEventListener('change', onBreakpoint);
    } else if (typeof phoneQuery.addListener === 'function') {
      phoneQuery.addListener(onBreakpoint);
    }
  }

  /* ---------- search ---------- */

  var FACETS = [{ id: 'screen', en: 'screen', uk: 'екран', color: 'var(--kind-state)' }]
    .concat(HAS_KEYS ? [{ id: 'key', en: 'localization key', uk: 'ключ локалізації', color: 'var(--brand)' }] : [])
    .concat(KINDS.filter(function (kind) { return kind !== JOURNAL.state; }).map(function (kind) {
      return { id: kind, en: kind, uk: kind, color: 'var(--kind-' + kind + ')' };
    }))
    .concat([{ id: 'step', en: 'step', uk: 'крок', color: 'var(--ink-soft)' }]);
  var RESULT_LIMIT = 60;
  var searchInput = document.getElementById('q');
  var resultsBox = document.getElementById('results');
  var searchIndex = [];
  var keyRows = (data.localeKeys || []).map(function (row) {
    return { key: row.key, values: localeValuesOf(row.key), usages: row.usages, stages: row.stages || {}, status: row.status || 'pending', place: row.place || '', widget: row.widget || '' };
  });
  var keyRow = {};
  var keyByLower = {};
  keyRows.forEach(function (row) {
    keyRow[row.key] = row;
    keyByLower[row.key.toLowerCase()] = row.key;
  });
  var search = { query: '', facet: null, open: false, active: 0, rows: [], keys: [], counts: {}, perFlow: {}, hits: {}, targets: [] };

  function t(en, uk) { return lang === 'uk' ? uk : en; }
  function lower(value) { return String(value == null ? '' : value).toLowerCase(); }
  function normalizePath(path) { return String(path || '').replace(/\d+/g, '{id}'); }
  function localeValue(locale, key) { return ((data.locales || {})[locale] || {})[key]; }

  function localeValuesOf(key) {
    var values = {};
    LOCALES.forEach(function (locale) { values[locale] = localeValue(locale, key); });
    return values;
  }

  function keyText(row, locale) { return textOf(row.values[locale]); }

  function keyShownText(row) { return keyText(row, series) || keyText(row, DEFAULT_LOCALE); }

  function keyTexts(row) {
    return LOCALES.map(function (locale) { return keyText(row, locale); }).join(' ');
  }

  function textOf(value) {
    if (value == null) { return ''; }
    if (typeof value === 'string') { return value; }
    return Object.keys(value).map(function (form) { return form + ': ' + value[form]; }).join(' · ');
  }

  function ukPlural(n, one, few, many) {
    var mod10 = n % 10;
    var mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) { return one; }
    if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) { return few; }
    return many;
  }

  function countWord(n, en, one, few, many) {
    return n + ' ' + (lang === 'uk' ? ukPlural(n, one, few, many) : en + (n === 1 ? '' : 's'));
  }

  function highlighted(text, cls, query) {
    var span = el('span', cls);
    var value = String(text == null ? '' : text);
    var q = lower(query == null ? search.query : query).trim();
    var at = q ? value.toLowerCase().indexOf(q) : -1;
    if (at < 0) { span.textContent = value; return span; }
    var from = 0;
    while (at >= 0) {
      span.appendChild(document.createTextNode(value.slice(from, at)));
      span.appendChild(el('mark', null, value.slice(at, at + q.length)));
      from = at + q.length;
      at = value.toLowerCase().indexOf(q, from);
    }
    span.appendChild(document.createTextNode(value.slice(from)));
    return span;
  }

  function frameDataAt(variant, index) {
    return index < stagesOf(variant).length ? stagesOf(variant)[index] : endOf(variant);
  }

  function frameCount(variant) { return stagesOf(variant).length + (hasEnd(variant) ? 1 : 0); }

  function frameKeysOf(frameData) {
    return (frameData && frameData.keys) || [];
  }

  function addEntry(entry, hay) {
    entry.hay = lower(hay);
    searchIndex.push(entry);
  }

  function recordText(record) {
    if (record.kind === JOURNAL.analytics) { return record.name || ''; }
    return (record.method ? record.method + ' ' : '') + (record.path || '');
  }

  function indexRecords(base, records, hays) {
    var seenByKind = {};
    recordsOf(records).forEach(function (record) {
      var kindHays = record && hays ? hays[record.kind] : null;
      if (!Array.isArray(kindHays)) { return; }
      var at = seenByKind[record.kind] || 0;
      seenByKind[record.kind] = at + 1;
      addEntry(Object.assign({ facet: record.kind, text: recordText(record) }, base), kindHays[at]);
    });
  }

  function indexKeys(base, frameData) {
    frameKeysOf(frameData).forEach(function (hit) {
      var row = keyRow[hit.k];
      if (!row) { return; }
      var value = keyShownText(row);
      addEntry(Object.assign({ facet: 'key', key: row.key, text: row.key + ' · ' + value }, base),
        row.key + ' ' + keyTexts(row));
    });
  }

  function buildSearchIndex() {
    searchIndex = [];
    flows.forEach(function (flow, f) {
      variantsOf(flow).forEach(function (variant, v) {
        if (isPlainObject(variant.entry)) {
          var entryTitle = variant.entry.title || {};
          addEntry({ facet: 'screen', text: t('Entry point', 'Точка входу') + ' · ' + localizedText(entryTitle, ''), f: f, v: v, part: 'frame', i: 0 },
            [allTexts(entryTitle), variant.entry.launchedBy].join(' '));
        }
        for (var i = 0; i < frameCount(variant); i++) {
          var frameData = frameDataAt(variant, i) || {};
          var frameHays = (frameData.search || {}).frame || {};
          var base = { f: f, v: v, part: 'frame', i: i };
          var screenText = (frameData.screen || '') + (frameData.designScreen ? ' · ' + frameData.designScreen : '');
          addEntry(Object.assign({ facet: 'screen', text: screenText }, base), frameHays.screen);
          indexRecords(base, frameData.onScreenOpen, frameHays);
          indexKeys(base, frameData);
        }
        stagesOf(variant).forEach(function (stage, i) {
          var arrowHays = (stage.search || {}).arrow || {};
          var base = { f: f, v: v, part: 'arrow', i: i };
          var title = stage.title || {};
          var text = (stage.label || '') + (hasText(title) ? ' · ' + localizedText(title, '') : '');
          addEntry(Object.assign({ facet: 'step', text: text }, base), arrowHays.step);
          indexRecords(base, stage.afterAction, arrowHays);
        });
      });
    });
  }

  function subjectKey(entry) { return entry.f + ':' + entry.v + ':' + entry.part + ':' + entry.i; }

  function runSearch() {
    var q = lower(search.query).trim();
    search.rows = [];
    search.keys = [];
    search.counts = {};
    search.perFlow = {};
    search.hits = {};
    if (!q) { return; }
    var exactKey = keyByLower[q] || null;
    var seenByFacet = {};
    var seen = {};
    var hitKeys = {};
    FACETS.forEach(function (facet) { search.counts[facet.id] = 0; seenByFacet[facet.id] = {}; });
    searchIndex.forEach(function (entry) {
      if (exactKey ? entry.key !== exactKey : entry.hay.indexOf(q) < 0) { return; }
      if (entry.key) { hitKeys[entry.key] = true; }
      var key = subjectKey(entry);
      if (!seenByFacet[entry.facet][key]) { seenByFacet[entry.facet][key] = true; search.counts[entry.facet] += 1; }
      if (search.facet && search.facet !== entry.facet) { return; }
      if (seen[key]) { return; }
      seen[key] = true;
      search.rows.push(entry);
      search.hits[key] = true;
      search.perFlow[entry.f] = (search.perFlow[entry.f] || 0) + 1;
    });
    if (!search.facet || search.facet === 'key') {
      search.keys = keyRows.filter(function (row) {
        if (hitKeys[row.key]) { return false; }
        if (exactKey) { return row.key === exactKey; }

      });
    }
  }

  function isSearching() { return lower(search.query).trim() !== ''; }

  function isFrameHit(frame) {
    return frame.members.some(function (member) {
      return member.through.some(function (v) {
        var variant = currentVariants()[v];

        return search.hits[state.flow + ':' + v + ':frame:' + index];
      });
    });
  }

  function isEdgeHit(edge) {
    return edge.through.some(function (v) { return search.hits[state.flow + ':' + v + ':arrow:' + edge.depth]; });
  }

  function markSearchFrame(node, frame) {
    if (!isSearching()) { return; }
    node.classList.add(isFrameHit(frame) ? 'is-search-hit' : 'is-search-miss');
  }

  function markSearchEdge(node, edge) {
    if (isSearching()) { node.classList.add(isEdgeHit(edge) ? 'is-search-hit' : 'is-search-miss'); }
    return node;
  }

    var hits = search.perFlow[flowIndex] || 0;
    if (hits) { tab.appendChild(el('span', 'search-hits', String(hits))); } else { tab.classList.add('is-search-miss'); }
  }

  function renderFacets() {
    var box = document.getElementById('facets');

    document.getElementById('facets-label').textContent = t('Search in:', 'Шукати в:');

      var button = el('button', 'facet', facet[lang]);
      button.type = 'button';
      button.style.setProperty('--facet-color', facet.color);
      button.setAttribute('aria-pressed', String(search.facet === facet.id));
      if (isSearching()) {
        var n = search.counts[facet.id] || 0;
        button.appendChild(el('span', 'n', String(n)));
        if (!n) { button.classList.add('is-zero'); }
      }
      button.addEventListener('click', function () {
        search.facet = search.facet === facet.id ? null : facet.id;
        search.active = 0;
        search.open = isSearching();

        searchInput.focus();

    });
  }

  function renderSearchCount() {
    var count = document.getElementById('search-count');
    document.getElementById('q-clear').hidden = !isSearching();
    var narrowSearch = typeof window.matchMedia === 'function' && window.matchMedia('(max-width: 640px)').matches;
    searchInput.placeholder = narrowSearch
      ? t('Screen, key, request, event…', 'Екран, ключ, запит, подія…')
      : t('screen, localization key, /request/path, analytics event, step…', 'екран, ключ локалізації, /шлях запиту, подія аналітики, крок…');

  }

  function searchSummary() {
    return countWord(search.rows.length, 'match', 'збіг', 'збіги', 'збігів') + searchSummaryTail();

  function searchSummaryTail() {
    var text = ' · ' + Object.keys(search.perFlow).length + ' ' + t('flows', 'флоу');

  }

  function renderSearchMode() {
    var searching = isSearching();
    document.getElementById('search-mode').hidden = !searching;
    document.body.classList.toggle('is-search-mode', searching);
    var exit = document.getElementById('search-mode-exit');
    exit.textContent = '';
    exit.appendChild(el('span', 'search-mode-wide', t('Exit search', 'Вийти з пошуку')));
    exit.appendChild(el('span', 'search-mode-narrow', t('Exit', 'Вийти')));

    label.appendChild(el('span', 'search-mode-query', '«' + search.query.trim() + '»'));
    label.appendChild(document.createTextNode(' · ' + countWord(search.rows.length, 'match', 'збіг', 'збіги', 'збігів')));

  function clearSearch() {
    searchInput.value = '';
    search.query = '';
    search.open = false;

  }

  function collapsedRows() {
    var rows = [];
    var byScreen = {};
    search.rows.forEach(function (entry) {

    return rows;
  }

  function renderResults() {

    }

    if (rows.length > RESULT_LIMIT) { foot += ' · ' + t('narrow with a facet: ', 'звузьте фасетою: ') + (rows.length - RESULT_LIMIT) + t(' more', ' ще'); }
    resultsBox.appendChild(el('p', 'results-foot', foot));
    markActive();
  }

  function resultRow(entry, more) {
    var variant = variantsOf(flows[entry.f])[entry.v];
    var button = el('button', 'result');
    button.type = 'button';
    button.setAttribute('role', 'option');
    var isEnd = entry.part === 'frame' && entry.i >= stagesOf(variant).length;
    var pos = entry.part === 'frame' ? (isEnd ? t('end', 'фінал') : t('screen ', 'кадр ') + (entry.i + 1)) : t('action ', 'дія ') + (entry.i + 1);
    button.appendChild(el('span', 'result-pos', pos));
    var main = el('span', 'result-main');
    var caption = entry.part === 'frame' ? ((frameDataAt(variant, entry.i) || {}).screen || '') : (stagesOf(variant)[entry.i].label || '');
    var title = caption + ' · ' + localizedText(variant.title, variant.name);
    if (more) { title += ' · ' + t('+' + more + ' screens', 'ще ' + more + ' ' + ukPlural(more, 'кадр', 'кадри', 'кадрів')); }
    main.appendChild(el('span', 'result-title', title));
    main.appendChild(highlighted(entry.text, 'result-match'));
    button.appendChild(main);
    var facet = FACETS.filter(function (item) { return item.id === entry.facet; })[0];
    var chip = el('span', 'kind-chip', facet[lang]);
    chip.style.setProperty('--chip', facet.color);

    var go = function () { goToEntry(entry); };
    button.addEventListener('click', go);
    search.targets.push({ node: button, go: go });
    return button;
  }

  function keyResultRow(row) {
    var button = el('button', 'result');
    button.type = 'button';
    button.setAttribute('role', 'option');
    button.appendChild(el('span', 'result-pos', t('key', 'ключ')));
    var main = el('span', 'result-main');
    main.appendChild(highlighted(row.key, 'result-title'));
    main.appendChild(highlighted(keyShownText(row), 'result-match'));
    button.appendChild(main);
    button.appendChild(statusChip(row.status));
    var go = function () { search.open = false; renderResults(); };
    button.addEventListener('click', go);
    search.targets.push({ node: button, go: go });
    return button;
  }

  var KEY_STATUSES = [
    { id: 'onFrames', en: 'On frames', uk: 'На кадрах', color: 'var(--ok)' },
    { id: 'codeOnly', en: 'Code only', uk: 'Тільки в коді', color: 'var(--ink-soft)' },
    { id: 'unused', en: 'Unused', uk: 'Не використовується', color: 'var(--muted)' },
    { id: 'pending', en: 'Not captured yet', uk: 'Ще не знято', color: 'var(--warn)' }

    return KEY_STATUSES.filter(function (status) { return status.id === id; })[0] || KEY_STATUSES[KEY_STATUSES.length - 1];
  }

  function statusChip(id) {
    var status = keyStatusOf(id);
    var chip = el('span', 'kind-chip kp-status', t(status.en, status.uk));
    chip.style.setProperty('--chip', status.color);
    return chip;
  }

  function markActive() {
    search.targets.forEach(function (target, n) { target.node.classList.toggle('is-active', n === search.active); });
    var current = search.targets[search.active];
    if (current) { current.node.scrollIntoView({ block: 'nearest' }); }
  }

  function goToEntry(entry) {
    search.open = false;
    if (KINDS.indexOf(entry.facet) >= 0) { state.kind = entry.facet; state.open[entry.facet] = true; }
    else if (entry.facet === 'key') { state.open.locale = true; }
    else if (entry.facet === 'screen') { state.open.screen = true; }
    if (entry.f !== state.flow) { selectFlow(entry.f); }
    selectVariant(entry.v, { part: entry.part, index: entry.i });
    renderResults();
    revealFocus(true);
  }

  function refreshSearch() {
    runSearch();
    renderFacets();
    renderSearchCount();
    renderResults();
    if (flows.length) { renderFlowTabs(); renderCanvas(); renderInspector(); }
  }

  function searchFor(value, facet) {
    closeViewer();
    searchInput.value = value;
    search.query = value;
    search.facet = facet;
    search.active = 0;
    search.open = true;
    refreshSearch();
    if (!isTouchPointer()) {
      searchInput.focus();
      searchInput.select();
    }
    document.getElementById('search-bar').scrollIntoView({ block: 'nearest' });
  }

  function isTouchPointer() {
    return typeof window.matchMedia === 'function' && window.matchMedia('(pointer: coarse)').matches;
  }

  var FIND_PATH = 'M10.5 4.5a6 6 0 1 0 0 12a6 6 0 1 0 0-12z M15 15l5 5';

  function findButton(value, facet, label) {
    var button = el('button', 'rec-find');
    button.type = 'button';
    var icon = svgEl('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true' });
    icon.appendChild(svgEl('path', { d: FIND_PATH }));
    button.appendChild(icon);
    var text = t('Search this ' + label[0] + ' in all flows', 'Шукати ' + label[1] + ' по всіх флоу');
    button.title = text + ': ' + value;
    button.setAttribute('aria-label', text);
    button.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();
      searchFor(value, facet);
    });
    return button;
  }

  function initSearch() {
    buildSearchIndex();
    var timer = 0;
    searchInput.addEventListener('input', function () {
      window.clearTimeout(timer);
      timer = window.setTimeout(function () {
        search.query = searchInput.value;
        search.active = 0;
        search.open = true;
        if (keyByLower[lower(search.query).trim()]) { search.facet = 'key'; }
        refreshSearch();
      }, 120);
    });
    searchInput.addEventListener('focus', function () {
      if (isSearching()) { search.open = true; renderResults(); }
    });
    searchInput.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowDown') { event.preventDefault(); search.open = true; if (!search.targets.length) { renderResults(); } search.active = Math.min(search.targets.length - 1, search.active + 1); markActive(); }
      else if (event.key === 'ArrowUp') { event.preventDefault(); search.active = Math.max(0, search.active - 1); markActive(); }
      else if (event.key === 'Enter') { event.preventDefault(); if (search.targets[search.active]) { search.targets[search.active].go(); } }
      else if (event.key === 'Escape') { event.stopPropagation(); search.open = false; renderResults(); }
    });
    document.getElementById('q-clear').addEventListener('click', function () {
      clearSearch();
      searchInput.focus();
    });
    document.getElementById('search-mode-exit').addEventListener('click', clearSearch);
    document.getElementById('search-mode-text').addEventListener('click', function () {
      closeViewer();
      search.open = true;
      renderResults();
      document.getElementById('search-bar').scrollIntoView({ block: 'start' });
    });
    document.addEventListener('pointerdown', function (event) {
      if (!search.open || event.target.closest('#search-bar')) { return; }
      search.open = false;
      renderResults();
    });
    document.addEventListener('keydown', function (event) {
      if (event.key !== '/' || isTypingTarget(event.target)) { return; }
      event.preventDefault();
      searchInput.focus();
    });
    renderFacets();
    renderSearchCount();
  }

  /* ---------- localization tab ---------- */

  function localePanel(frameData) {
    var wrap = document.createDocumentFragment();
    wrap.appendChild(bilingual('p', 'loc-note',
      'Keys whose text the app drew on this screen.',
      'Ключі, чий текст застосунок показав на цьому кадрі.'));
    var hits = frameKeysOf(frameData).filter(function (hit) { return keyRow[hit.k]; });
    var q = lower(search.query).trim();
    var matches = function (row) { return q && lower(row.key + ' ' + keyTexts(row)).indexOf(q) >= 0; };
    hits.sort(function (a, b) { return Number(matches(keyRow[b.k])) - Number(matches(keyRow[a.k])); });
    var list = el('ol', 'recs');
    hits.forEach(function (hit) { list.appendChild(localeItem(keyRow[hit.k])); });
    if (hits.length) { wrap.appendChild(list); } else { wrap.appendChild(bilingual('p', 'insp-empty', 'No translated text on this screen.', 'На цьому кадрі немає перекладених текстів.')); }
    return wrap;
  }

  function isSameKeyText(row, locale) {
    return stableJson(row.values[locale]) === stableJson(row.values[DEFAULT_LOCALE]);
  }

  function localeItem(row) {
    var item = el('li', 'rec rec-locale');

  function attachSwipe(node) {
    var start = null;
    node.addEventListener('touchstart', function (event) {
      if (event.touches.length !== 1) { start = null; return; }
      start = { x: event.touches[0].clientX, y: event.touches[0].clientY };
    }, { passive: true });
    node.addEventListener('touchend', function (event) {
      if (!start || !event.changedTouches.length) { return; }
      var dx = event.changedTouches[0].clientX - start.x;
      var dy = event.changedTouches[0].clientY - start.y;
      start = null;
      if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) { return; }
      event.preventDefault();
      if (dx < 0) { stepNext(); } else { goStep(viewerIndex() - 1); }
    });

      return;
    }
    if (isTypingTarget(event.target) || event.altKey || event.ctrlKey || event.metaKey) { return; }
    if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
      event.stopPropagation();

      restoreInspector();
      return;
    }
    renderSteps();
    renderViewer();

  var lastTabsFlow = null;

  function updateTabFades() {
    var max = flowTabs.scrollWidth - flowTabs.clientWidth;

    flowTabs.classList.toggle('fade-right', max > 4 && flowTabs.scrollLeft < max - 4);

    if (tab && flowTabs.scrollWidth > flowTabs.clientWidth) {

  function addScrollArrows(scroller) {
    var strip = scroller.parentNode;
    var arrows = [-1, 1].map(function (direction) {
      var arrow = el('button', 'strip-arrow ' + (direction < 0 ? 'is-left' : 'is-right'));
      arrow.type = 'button';

      arrow.tabIndex = -1;

      arrow.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="' + (direction < 0 ? 'M10 3 5 8l5 5' : 'M6 3l5 5-5 5') + '"/></svg>';
      arrow.addEventListener('click', function () {
        scroller.scrollBy({ left: direction * scroller.clientWidth * 0.8, behavior: 'smooth' });
      });
      strip.appendChild(arrow);
      return arrow;
    });
    function update() {
      var max = scroller.scrollWidth - scroller.clientWidth;
      arrows[0].hidden = !(max > 4 && scroller.scrollLeft > 4);
      arrows[1].hidden = !(max > 4 && scroller.scrollLeft < max - 4);

    scroller.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    new MutationObserver(update).observe(scroller, { childList: true, subtree: true, characterData: true });

  /* ---------- site menu + localization keys page ---------- */

  function pageIdOfTable(table) { return table.id === 'localeKeys' ? 'keys' : table.id; }

  /* ----- keys data ----- */

  var keysModel = null;

  function textsOfKey(row) {
    var texts = {};
    LOCALES.forEach(function (locale) { texts[locale] = keyText(row, locale); });
    return texts;
  }

  function buildKeysModel() {
    var variantByStageId = {};
    flows.forEach(function (flow, f) {
      variantsOf(flow).forEach(function (variant, v) { variantByStageId[flow.name + '/' + variant.name] = { f: f, v: v, variant: variant }; });
    });
    var rows = keyRows.map(function (row) {
      var model = { key: row.key, values: textsOfKey(row), usages: row.usages, status: row.status, place: row.place, widget: row.widget, seen: [], seenByPlace: {} };
      Object.keys(row.stages).forEach(function (stageId) {
        var owner = variantByStageId[stageId];
        if (!owner) { return; }
        row.stages[stageId].forEach(function (i) { addSeenPlace(model, owner, i); });
      });
      return model;
    });
    rows.sort(function (a, b) { return a.key.localeCompare(b.key); });
    return rows;
  }

  function addSeenPlace(model, stageOwner, i) {
    var owner = sharedStageOwner(stageOwner, i);
    var stages = owner.variant.stages || [];
    var stage = (i < stages.length ? stages[i] : owner.variant.end) || {};
    var screenName = stage.designScreen || stage.screen || '';
    var place = owner.f + '|' + screenName;
    if (!model.seenByPlace[place]) {
      model.seenByPlace[place] = { f: owner.f, v: owner.v, i: i, variantName: owner.variant.name, designUrl: stage.designUrl, screen: screenName, route: stage.screen || '', count: 0 };
      model.seen.push(model.seenByPlace[place]);
    }
    model.seenByPlace[place].count += 1;
  }

  /* a stage a state walk shares with its main walk is seen on the main walk */
  function sharedStageOwner(owner, i) {
    var flow = flows[owner.f];
    var target = stateWalkTarget(flow, owner.v);
    if (!target || i >= target.at) { return owner; }
    return { f: owner.f, v: target.main, variant: variantsOf(flow)[target.main] };
  }

  var keysState = { q: '', filter: 'all', sort: 'key', open: {} };

  function keysFiltered() {
    var q = lower(keysState.q).trim();
    return keysModel.filter(function (row) {
      if (keysState.filter !== 'all' && row.status !== keysState.filter) { return false; }
      if (!q) { return true; }
      return lower(row.key + ' ' + LOCALES.map(function (locale) { return row.values[locale]; }).join(' ') + ' ' + row.seen.map(function (s) { return s.screen; }).join(' ')).indexOf(q) !== -1;
    }).sort(function (a, b) {
      if (keysState.sort === 'seen') { return b.seen.length - a.seen.length || a.key.localeCompare(b.key); }
      return a.key.localeCompare(b.key);
    });
  }

  function atlasHash(place) {
    var variant = variantsOf(flows[place.f])[place.v];

  }

  function designPlaces(row) {
    var urls = {};
    return row.seen.filter(function (place) {

      urls[place.designUrl] = true;

  function buildKeysShell() {
    keysPage.textContent = '';

    var statusCounts = KEY_STATUSES.map(function (status) {

  function exportNote(row) {
    if (!row.place) { return ''; }

  function csvCell(value) {
    var s = String(value == null ? '' : value);

  }

  function stamp() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  var XLSX_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  var xlsxPromise = null;

  function loadXlsx() {
    if (window.XLSX) { return Promise.resolve(window.XLSX); }
    if (!xlsxPromise) {
      xlsxPromise = new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = XLSX_SRC;
        script.onload = function () { resolve(window.XLSX); };
        script.onerror = function () { xlsxPromise = null; reject(new Error('xlsx')); };
        document.head.appendChild(script);
      });
    }
    return xlsxPromise;
  }

  function resolveDownloads() {
    if (window.claude && typeof window.claude.use === 'function') { return window.claude.use('downloads'); }
    return Promise.resolve({ save: saveInBrowser });
  }

  function saveInBrowser(file) {
    var link = el('a');
    link.href = URL.createObjectURL(new Blob([file.data]));
    link.download = file.filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    return Promise.resolve();
  }

  function exportKeys(kind, downloads, note) {
    var rows = exportRows();
    var columns = ['key', 'status'].concat(LOCALES, ['design_screen', 'route', 'design_urls', 'atlas_urls', 'code_usages', 'note']);
    note.textContent = '';
    var done = function (promise) {
      promise.then(function () {
        note.textContent = t('Exported ' + rows.length + ' keys.', 'Експортовано ' + rows.length + ' ключів.');
      }, function (error) {
        var code = error && error.code;
        if (code === 'declined') { return; }
        note.textContent = t('Export failed: ', 'Не вдалося експортувати: ') + (code || 'error');
      });
    };
    if (kind === 'csv') {
      var lines = [columns.join(',')].concat(rows.map(function (r) { return columns.map(function (c) { return csvCell(r[c]); }).join(','); }));
      done(downloads.save({ filename: STORE_PREFIX + '-localization-keys-' + stamp() + '.csv', data: '﻿' + lines.join('\r\n') }));
      return;
    }
    note.textContent = t('Preparing the Excel file…', 'Готую файл Excel…');
    loadXlsx().then(function (XLSX) {
      var sheet = XLSX.utils.json_to_sheet(rows, { header: columns });
      sheet['!cols'] = [{ wch: 36 }, { wch: 22 }].concat(LOCALES.map(function () { return { wch: 48 }; }), [{ wch: 28 }, { wch: 32 }, { wch: 60 }, { wch: 60 }, { wch: 60 }, { wch: 48 }]);
      sheet['!autofilter'] = { ref: sheet['!ref'] };
      var book = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(book, sheet, 'Keys');
      var buffer = XLSX.write(book, { bookType: 'xlsx', type: 'array' });
      note.textContent = '';
      done(downloads.save({ filename: STORE_PREFIX + '-localization-keys-' + stamp() + '.xlsx', data: buffer }));
    }, function () {
      note.textContent = t('Could not load the Excel library; CSV export still works.', 'Не вдалося завантажити бібліотеку Excel; експорт у CSV працює.');
    });
  }


  /* ---------- table pages of the project ---------- */

  function tableValueText(value) {
    if (value == null) { return ''; }
    if (typeof value === 'object') { return paramName(value) || JSON.stringify(value); }
    return String(value);
  }

  function tableValueItems(value) {
    return (Array.isArray(value) ? value : [value]).filter(function (item) { return item != null && item !== ''; }).map(tableValueText);
  }

  function tableValueCell(value, isFirst) {
    var items = tableValueItems(value);

  var TABLE_PAGES = (meta.tables || []).filter(function (table) { return table.id !== 'localeKeys'; }).map(function (table) {

    });
    var exportColumns = columns.map(function (column) { return column.key; });
    var hasUsages = rows.some(function (row) { return (row.usages || []).length > 0; });

  function buildTableModel(page) {
    var variantByStageId = {};
    flows.forEach(function (flow, f) {
      variantsOf(flow).forEach(function (variant, v) { variantByStageId[flow.name + '/' + variant.name] = { f: f, v: v, variant: variant }; });
    });
    var rows = (page.source || []).map(function (row) {
      var model = page.toModel(row);
      model.status = row.status || '';
      model.seen = [];
      model.seenByPlace = {};
      var stages = row.stages || {};
      Object.keys(stages).forEach(function (stageId) {
        var owner = variantByStageId[stageId];
        if (!owner) { return; }
        stages[stageId].forEach(function (i) { addSeenPlace(model, owner, i); });
      });
      model.title = page.title(model);
      return model;
    });
    rows.sort(function (a, b) { return a.title.localeCompare(b.title); });
    return rows;
  }

    var q = lower(page.state.q).trim();

      if (!q) { return true; }
      return lower(page.searchText(row) + ' ' + row.seen.map(function (s) { return s.screen; }).join(' ')).indexOf(q) !== -1;
    }).sort(function (a, b) {

    var csvBtn = el('button', 'kp-btn');
    csvBtn.type = 'button';
    csvBtn.appendChild(bilingual('span', null, 'Export CSV', 'Експорт CSV'));
    var xlsxBtn = el('button', 'kp-btn is-primary');
    xlsxBtn.type = 'button';
    xlsxBtn.appendChild(bilingual('span', null, 'Export Excel', 'Експорт Excel'));
    exportBox.appendChild(csvBtn);
    exportBox.appendChild(xlsxBtn);
    var exportNote = el('p', 'kp-export-note');
    bar.appendChild(exportBox);
    head.appendChild(bar);
    head.appendChild(exportNote);

    var count = el('p', 'kp-count');
    head.appendChild(count);
    root.appendChild(head);

    var table = el('div', 'kp-table tp-' + page.id);
    table.style.setProperty('--kp-cols', tableColumns(page));
    table.setAttribute('role', 'table');
    root.appendChild(table);

    resolveDownloads().then(function (downloads) {
      if (!downloads) { return; }
      exportBox.hidden = false;
      csvBtn.addEventListener('click', function () { exportTable(page, 'csv', downloads, exportNote); });
      xlsxBtn.addEventListener('click', function () { exportTable(page, 'xlsx', downloads, exportNote); });
    });

    return { seg: seg, table: table, count: count };
  }

  function refreshTable(page) {
    var rows = tableFiltered(page);
    Array.prototype.forEach.call(page.dom.seg.children, function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-filter') === page.state.filter));
    });
    page.dom.count.textContent = t(rows.length + ' of ' + page.model.length + ' ' + page.noun[0], rows.length + ' з ' + page.model.length + ' ' + page.noun[1]);
    var table = page.dom.table;
    table.textContent = '';
    var head = el('div', 'kp-row kp-row-head');
    head.setAttribute('role', 'row');
    tableHeadings(page)
      .forEach(function (c) {
        var cell = el('span', 'kp-cell');
        cell.setAttribute('role', 'columnheader');
        cell.appendChild(bilingual('span', null, c[0], c[1]));
        head.appendChild(cell);
      });
    table.appendChild(head);
    var limit = Math.min(rows.length, page.state.limit || 200);
    for (var i = 0; i < limit; i += 1) { table.appendChild(tableRowNode(page, rows[i])); }
    if (rows.length > limit) {
      var more = el('button', 'kp-more');
      more.type = 'button';
      more.textContent = t('Show ' + Math.min(200, rows.length - limit) + ' more', 'Показати ще ' + Math.min(200, rows.length - limit));
      more.addEventListener('click', function () { page.state.limit = limit + 200; refreshTable(page); });
      table.appendChild(more);
    }
    if (!rows.length) { table.appendChild(bilingual('p', 'kp-empty', page.emptyText[0], page.emptyText[1])); }
  }

  function tableHeadings(page) {
    return page.columns.map(function (column) { return [column.en, column.uk]; })
      .concat(page.hasSeen ? (HAS_DESIGN ? [['Design', 'Дизайн']] : []).concat([['Atlas', 'Атлас']]) : [])
      .concat(page.hasStatus ? [['Status · in code', 'Статус · у коді']] : []);
  }

  function tableColumns(page) {
    var count = page.columns.length;
    var list = ['minmax(160px, 1.2fr)'];
    for (var i = 1; i < count; i += 1) { list.push('minmax(0, 1fr)'); }
    if (page.hasSeen) {
      if (HAS_DESIGN) { list.push('minmax(0, 1fr)'); }
      list.push('minmax(0, 1.4fr)');
    }
    if (page.hasStatus) { list.push('minmax(150px, .8fr)'); }
    return list.join(' ');
  }

  function tableRowNode(page, row) {
    var node = el('div', 'kp-row');
    node.setAttribute('role', 'row');
    page.columns.forEach(function (column) { node.appendChild(column.cell(row)); });

    if (page.hasSeen) {
      if (!row.seen.length) {
        var noneCell = el('span', 'kp-cell kp-none');
        noneCell.setAttribute('role', 'cell');
        noneCell.style.gridColumn = 'span ' + seenSpan();
        noneCell.appendChild(bilingual('span', null, 'not on captured frames', 'немає на знятих кадрах'));
        node.appendChild(noneCell);
      } else {
        if (HAS_DESIGN) { node.appendChild(keyDesignCell(row)); }
        node.appendChild(tableAtlasCell(row, page.kind));
      }
    }

    if (!page.hasStatus) { return node; }
    var codeCell = el('span', 'kp-cell kp-code');
    codeCell.setAttribute('role', 'cell');
    node.appendChild(codeCell);
    if (row.status) { codeCell.appendChild(tableStatusChip(page, row.status)); }
    if (!row.usages.length) { return node; }
    var details = el('details');
    var nu = row.usages.length;
    details.appendChild(el('summary', null, t(nu + (nu === 1 ? ' usage' : ' usages'), nu + ' ' + ukPlural(nu, 'виклик', 'виклики', 'викликів'))));
    var list = el('ul');
    row.usages.forEach(function (u) { list.appendChild(el('li', 'kp-usage', u)); });
    details.appendChild(list);
    codeCell.appendChild(details);
    return node;
  }

  function codeListCell(items) {
    var cell = el('span', 'kp-cell');
    cell.setAttribute('role', 'cell');
    if (items.length) { cell.appendChild(codeList(items)); }
    return cell;
  }

  function codeList(items) {
    var list = el('span', 'kp-place');
    items.forEach(function (item, n) {
      if (n) { list.appendChild(document.createTextNode(', ')); }
      list.appendChild(el('code', null, item));
    });
    return list;
  }

  function textCell(text) {
    var cell = el('span', 'kp-cell kp-text', text);
    cell.setAttribute('role', 'cell');
    return cell;
  }

  function tableAtlasCell(row, kind) {
    var cell = el('span', 'kp-cell kp-links');
    cell.setAttribute('role', 'cell');
    row.seen.forEach(function (place) {
      var chip = el('a', 'kp-chip');
      chip.href = atlasHash(place);
      chip.title = flowTitle(place.f) + ' · ' + place.route;
      chip.appendChild(el('span', 'kp-chip-flow', flowTitle(place.f)));
      chip.appendChild(el('span', 'kp-chip-screen', place.screen));
      chip.addEventListener('click', function (event) {
        event.preventDefault();
        openStage(place, kind);
      });
      cell.appendChild(chip);
    });
    return cell;
  }

  function seenExportFields(row) {
    return {
      design_screen: row.seen.map(function (place) { return place.screen; }).join('\n'),
      route: row.seen.map(function (place) { return place.route; }).join('\n'),
      design_urls: row.seen.map(function (place) { return isDesignUrl(place.designUrl) ? place.designUrl : ''; }).join('\n'),
      atlas_urls: row.seen.map(function (place) { return new URL(atlasHash(place), window.location.href).href; }).join('\n')
    };
  }

  function tableExportRows(page) {
    return tableFiltered(page).map(function (row) {
      var fields = page.exportFields(row);
      var seen = seenExportFields(row);
      if (row.status) { fields.status = tableStatusOf(page, row.status).uk; }
      SEEN_EXPORT_COLUMNS.forEach(function (column) { fields[column] = seen[column]; });
      return fields;
    });
  }

  function exportTable(page, kind, downloads, note) {
    var rows = tableExportRows(page);
    var columns = page.exportColumns.concat(page.hasSeen ? SEEN_EXPORT_COLUMNS : []);
    note.textContent = '';
    var done = function (promise) {
      promise.then(function () {
        note.textContent = t('Exported ' + rows.length + ' ' + page.noun[0] + '.', 'Експортовано ' + rows.length + ' ' + page.noun[1] + '.');
      }, function (error) {
        var code = error && error.code;
        if (code === 'declined') { return; }
        note.textContent = t('Export failed: ', 'Не вдалося експортувати: ') + (code || 'error');
      });
    };
    if (kind === 'csv') {
      var lines = [columns.join(',')].concat(rows.map(function (r) { return columns.map(function (c) { return csvCell(r[c]); }).join(','); }));
      done(downloads.save({ filename: page.fileName + stamp() + '.csv', data: '﻿' + lines.join('\r\n') }));
      return;
    }
    note.textContent = t('Preparing the Excel file…', 'Готую файл Excel…');
    loadXlsx().then(function (XLSX) {
      var sheet = XLSX.utils.json_to_sheet(rows, { header: columns });
      sheet['!cols'] = columns.map(function (column) { return { wch: page.exportWidths[column] || (column === 'design_screen' ? 28 : column === 'route' ? 32 : 60) }; });
      sheet['!autofilter'] = { ref: sheet['!ref'] };
      var book = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(book, sheet, page.sheet);
      var buffer = XLSX.write(book, { bookType: 'xlsx', type: 'array' });
      note.textContent = '';
      done(downloads.save({ filename: page.fileName + stamp() + '.xlsx', data: buffer }));
    }, function () {
      note.textContent = t('Could not load the Excel library; CSV export still works.', 'Не вдалося завантажити бібліотеку Excel; експорт у CSV працює.');
    });
  }

  /* ---------- boot ---------- */

  var brandLetter = String(meta.projectName || 'A').charAt(0).toUpperCase();
  ['side-logo', 'head-logo'].forEach(function (id) { document.getElementById(id).textContent = brandLetter; });
  document.getElementById('side-name').textContent = (meta.projectName || '') + ' · Atlas';
  document.getElementById('head-project').textContent = meta.projectName || '';
  renderVersionSwitch();
  applyLang(readStoredLang() || 'en');
  renderStats();
  if (flows.length) {
    var initial = readHash();
    state.flow = initial.flow;
    state.variant = initial.variant;
    state.stateWalk = initial.stateWalk;
    state.focus = initial.focus;
    var hasFocusInHash = /\.(f\d+|a\d+|end)$/.test(window.location.hash);
    initSearch();
    renderAll();
    var bootPage = pageOfHash();
    if (window.location.hash && bootPage === 'flows') { writeHash(); }
    if (bootPage !== 'flows') { showPage(bootPage); } else { renderMenus(); }
    revealFocus(hasFocusInHash);
  } else {
    renderEmpty();
  }
});
</script>
</body>
</html>

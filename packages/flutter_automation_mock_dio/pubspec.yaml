name: flutter_automation_mock_dio
description: Dio adapter that answers the requests of an app from the in-memory mock of flutter_automation_mock.
version: 0.5.0
repository: https://github.com/valeriinov/flutter_automation
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ^3.47.5

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  flutter_automation_mock:
    git:
      url: https://github.com/valeriinov/flutter_automation.git
      ref: 0.5.0
      path: packages/flutter_automation_mock

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

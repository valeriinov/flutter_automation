name: flutter_automation_runner
description: Command line runner that walks flows of a running Flutter app through Flutter Driver.
version: 0.6.0
repository: https://github.com/valeriinov/flutter_automation
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ^3.47.5

resolution: workspace

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_automation:
    git:
      url: https://github.com/valeriinov/flutter_automation.git
      ref: 0.6.0
      path: packages/flutter_automation
  flutter_automation_mock:
    git:
      url: https://github.com/valeriinov/flutter_automation.git
      ref: 0.6.0
      path: packages/flutter_automation_mock
  flutter_automation_driver:
    git:
      url: https://github.com/valeriinov/flutter_automation.git
      ref: 0.6.0
      path: packages/flutter_automation_driver
  image: ^4.10.1
  vm_service: ^15.3.0
  yaml: ^3.1.3

dev_dependencies:
  flutter_lints: ^6.0.0

name: flutter_automation_mock
description: In-memory Dio transport, request contract and journal for answering an app's backend from a mock.
version: 0.3.0
repository: https://github.com/valeriinov/flutter_automation
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ^3.47.5

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_automation:
    git:
      url: https://github.com/valeriinov/flutter_automation.git
      ref: 0.3.0
      path: packages/flutter_automation

dev_dependencies:
  build_runner: ^2.16.1
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1

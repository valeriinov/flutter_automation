name: flutter_automation_mock
description: In-memory mock backend, scenario, substitutes and agent commands for driving an app without its remote environment.
version: 0.6.1
repository: https://github.com/valeriinov/flutter_automation
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ^3.47.5

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  flutter_automation:
    git:
      url: https://github.com/valeriinov/flutter_automation.git
      ref: 0.6.1
      path: packages/flutter_automation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.16.1
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1
